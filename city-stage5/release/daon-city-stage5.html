function close(){modalKind='';$('#modal-root').innerHTML=''}
function modal(title,subtitle,body,actions='',wide=false){$('#modal-root').innerHTML=`<div class="modal-backdrop"><section role="dialog" aria-modal="true" aria-label="${esc(title)}" class="modal ${wide?'wide':''}"><header><div><h2>${esc(title)}</h2><p>${esc(subtitle)}</p></div><button class="close" data-action="close" aria-label="닫기">×</button></header>${body}${actions?`<div class="modal-actions">${actions}</div>`:''}</section></div>`;setTimeout(()=>$('#modal-root button')?.focus(),0)}
function startForm(isNew=false){modalKind='start';const content=`<p class="intro">같은 지도, 서로 다른 출발점. 2026년부터 8년 동안 어디에 먼저 투자할지 결정하세요.</p><div class="scenario-grid">${scenarios.map((s,i)=>`<button class="scenario ${s.id===startScenario?'active':''}" data-action="scenario" data-id="${s.id}"><strong>${esc(s.name)}</strong><p>${esc(s.description)}</p><small>${i===0?'첫 플레이 추천 · ':''}${s.goal==='resilience'?'생활 여건 개선에 집중':'정착 기반 개선에 집중'}</small></button>`).join('')}</div><div class="form-row"><label>도전 목표<select id="start-goal"><option value="settlement" ${startGoal==='settlement'?'selected':''}>정착 기반 — 순이동과 취업 개선</option><option value="resilience" ${startGoal==='resilience'?'selected':''}>생활 회복 — 돌봄과 의료 접근성 개선</option></select></label><label>난수 시드<input id="start-seed" type="number" step="1" value="${isNew?Date.now()%1000000:2026}"></label></div><div class="intro-box note">기본 정책 6개는 항상 열어볼 수 있습니다. 추천 정책과 사건 기회는 도시 상태에 따라 달라집니다. 같은 조건·시드·선택은 같은 결과를 만듭니다. 시민·차량은 상태를 표현하는 장식이며 개별 이동을 계산하지 않습니다.</div><p class="note">기존 버전 저장 키는 건드리지 않습니다. 이 복원판은 별도 저장 공간을 사용합니다. 모든 정책 수치는 교육용 게임 모형의 가정입니다.</p>`;
if(state)modal('새로운 도시 조건으로 도전','이전 도전 기록은 보존합니다.',content,'<button data-action="close">돌아가기</button><button class="primary" data-action="start">새 도전 시작</button>',true);else{$('#app').innerHTML=`<main class="start-page"><div class="eyebrow">DAON · CITY CHRONICLES</div><h1>다온시, 여덟 해의 선택</h1><p class="subtitle">도시의 성장은 인구만으로 결정되지 않습니다.</p><section class="panel">${content}<div class="modal-actions"><button data-action="import">저장 파일 불러오기</button><button class="primary" data-action="start">도시 운영 시작</button></div></section></main>`}}
function checks(){return E.evaluate(state).checks.map(c=>`<div class="goalcheck"><span class="${c.pass?'passed':'not-passed'}">${c.pass?'✓':'·'} ${esc(c.label)}</span><span>${esc(c.value)}${c.target!==undefined?' / '+esc(c.target):''}</span></div>`).join('')}
function metricsCards(d){return `<div class="stats"><div class="stat"><span>실제 입주 / 주택 공급</span><strong>${num(d.occupiedHomes)} / ${num(d.housingCapacity)}</strong></div><div class="stat"><span>실제 취업 / 일자리 수</span><strong>${num(d.employed)} / ${num(d.jobCapacity)}</strong></div><div class="stat"><span>서비스 이용 / 수요</span><strong>${num(d.serviceUsed)} / ${num(d.serviceDemand)}</strong></div><div class="stat"><span>의료 접근성</span><strong>${pct(d.healthAccess)}</strong></div></div>`}
function inspector(){const d=dm(),ps=(state.projects||[]).filter(p=>(!p.district||p.district===district)&&projectArea(p)===selected);return `<section class="panel"><div class="panel-title"><h3>${esc(areas[selected])}</h3><span class="tag">${esc(d.name)}</span></div><p class="note">아래 수치는 개별 건물 배분이 아닌 생활권 전체 합계입니다.</p>${metricsCards(d)}${ps.length?ps.map(p=>`<div class="progress-row"><strong>${esc(projectPolicy(p).name)}</strong> · ${p.status==='building'?'공사·준비 중':p.status==='paused'?'운영 중지':'운영 중'}<br><span class="note">${2026+p.startedTurn}년 시행 → ${2026+p.readyTurn}년 운영 · 현재 유지비 ${money(p.status==='active'?projectPolicy(p).upkeep:0)}/년</span></div>`).join(''):'<p class="note">시행한 사업 없음 · 기존 시설을 이용하고 있습니다.</p>'}${(state.events||[]).filter(e=>e.district===district&&e.area===selected).map(e=>`<div class="progress-row"><strong>${esc(e.title)} · ${esc(e.label)}</strong><br><span class="note">${2026+e.turn}년 선택 → ${2026+e.readyTurn}년 ${e.applied?'반영 완료':'반영 예정'}<br>${esc(e.description)}</span></div>`).join('')}<details><summary>공급·수요와 현재 병목</summary><p class="note">서비스 설계 ${num(d.serviceCapacity)} · 가동 가능 ${num(d.effectiveCapacity)} · 미충족 ${num(d.unmet)}<br>어린이 ${num(d.children)} · 생산연령 ${num(d.workingAge)} · 고령 ${num(d.seniors)}<br>공실 ${num(d.vacantHomes)} · 노동 공급 ${num(d.laborSupply)}</p>${(d.bottlenecks||[]).map(x=>`<p class="bottleneck">${esc(x)}</p>`).join('')}</details><button class="subtle" style="margin-top:10px;width:100%" data-action="compare">초기·현재 비교</button></section>`}
function policyPanel(){let ids=allPolicies?policies.map(p=>p.id):E.opportunities(state,district);if(!Array.isArray(ids))ids=policies.map(p=>p.id);ids=ids.map(x=>typeof x==='string'?x:x.id);const shown=policies.filter(p=>ids.includes(p.id));return `<section class="panel"><div class="panel-title"><h3>${allPolicies?'기본 정책 전체':'지금의 투자 기회'}</h3><button class="subtle" data-action="all" style="font-size:11px;padding:3px 7px">${allPolicies?'추천 보기':'전체 6개'}</button></div><p class="note">연간 새 사업 1개 · 공사 동시 1개<br>생활권 정책의 대상: ${esc(dm().name)}</p><div>${shown.map(p=>{const st=E.policyStatus(state,p.id,p.scope==='city'?null:district);return `<article class="policy"><div class="policy-title"><strong>${esc(p.name)}</strong><span class="tag">${p.scope==='city'?'도시 전체':'선택 생활권'}</span></div><p>${esc(p.description)}</p><div class="cost">투자 ${money(p.cost)} · ${p.delay===0?'즉시 운영':p.delay+'년 뒤 운영'} · 연 ${sign(p.upkeep)}억 유지비</div><button data-action="policy" data-id="${p.id}" ${!st.canStart?'disabled':''}>${st.canStart?'비용·시점 확인':esc(st.reason||'이미 시행한 정책')}</button>${st.canToggle?`<button class="subtle" data-action="toggle" data-id="${p.id}">${st.status==='paused'?'운영 재개':'운영 중지'}</button>`:''}</article>`}).join('')||'<p class="empty">현재 추천 사업이 없습니다. 전체 정책에서 기본 대응을 확인하세요.</p>'}</div></section>`}
function render(){if(!state){startForm();return}const m=E.metrics(state),d=dm();district=d.id;const completed=state.phase==='complete'||state.turn>=8;$('#app').innerHTML=`<header class="topbar"><div class="brand"><div class="eyebrow">DAON CITY</div><h1>다온시, 여덟 해의 선택</h1><small>${esc(scenarioName(state.scenario))} · 시드 ${esc(state.seed)}</small></div><div class="resources"><div class="resource"><span>시점 · 1턴 = 1년</span><strong>${state.year}년</strong><small>${state.turn} / 8년 경과</small></div><div class="resource"><span>보유 예산</span><strong>${money(state.cash)}</strong><small>연간 수지 ${sign(m.annualBalance)}억</small></div><div class="resource"><span>총인구</span><strong>${num(m.population)}명</strong><small>금년 ${sign(m.naturalChange+m.netMigration)}명</small></div><div class="resource"><span>돌봄 수요 충족</span><strong>${pct(m.coverage)}</strong><small>이용 ${num(m.serviceUsed)} / 수요 ${num(m.serviceDemand)}</small></div></div><div class="tools"><button data-action="goals">목표</button><button data-action="save">저장</button><button data-action="help">도움말</button></div></header><main class="layout"><div class="map-column">${state.pending?`<div class="event-banner"><div><strong>${esc(state.pending.title)}</strong><p>도시의 제안이 도착했습니다. 다음 해 전에 대응을 선택하세요.</p></div><button data-action="event">대응 선택</button></div>`:''}<div class="map-heading"><div><div class="eyebrow">OUR NEIGHBOURHOOD</div><h2>${esc(d.name)}</h2></div><nav class="tabs" aria-label="생활권 선택">${districts().map(x=>`<button class="${x.id===district?'active':''}" data-action="district" data-id="${x.id}">${esc(x.name)}</button>`).join('')}</nav></div><div class="stage-note">${state.turn<3?'초반 · 공실, 일자리, 서비스 부족을 살펴보고 첫 투자를 정하세요.':state.turn<6?'중반 · 투자한 시설의 실제 이용과 유지비를 확인하세요.':'후반 · 남은 기간에 운영을 시작할 수 있는 사업부터 검토하세요.'}</div><div class="map-shell"><div class="map-controls"><button data-action="zoom" data-value="1">1×</button><button data-action="zoom" data-value="2">2×</button><button data-action="zoom" data-value="3">3×</button><button data-action="pause">${paused?'움직임 재생':'움직임 정지'}</button></div><div class="map-scroll"><canvas id="city-canvas" width="480" height="320" aria-label="${esc(d.name)} 도트 도시 지도. 아래 시설 버튼으로도 선택할 수 있습니다."></canvas></div><div class="map-footer"><span>! 서비스 부족 · 막대: 입주·취업·수요 충족 · 창문: 입주 상태</span><span>고정 픽셀 · ${zoom}배 · 보행·차량은 보조 연출</span></div></div><nav class="place-buttons" aria-label="시설 선택">${Object.entries(areas).map(([id,name])=>`<button class="${id===selected?'active':''}" data-action="area" data-id="${id}">${name}</button>`).join('')}</nav><div class="turn-panel"><div><strong>${completed?'여덟 해의 기록이 완성되었습니다':state.pending?'도시의 제안을 먼저 확인하세요':8-state.turn+'번의 결산이 남았습니다'}</strong><br><small>선택 후 다음 해로 진행하면 공사·운영·재정·인구를 결산합니다.</small></div><button data-action="${completed?'ending':'next'}" ${state.pending&&!completed?'disabled':''}>${completed?'도시 결말 보기':'다음 해 →'}</button></div><div class="bottom-row"><section class="panel"><div class="panel-title"><h3>이번 도전의 목표</h3><span class="tag">${state.goal==='resilience'?'생활 회복':'정착 기반'}</span></div><div class="timeline">${Array.from({length:8},(_,i)=>`<i class="${i<state.turn?'done':''}"></i>`).join('')}</div>${checks()}</section><section class="panel"><h3>도시에 남은 성취</h3>${(state.achievements||[]).length?state.achievements.map(a=>`<div class="achievement"><span><strong>${esc(a.title)}</strong><br><small>${2026+a.turn}년 · ${esc(a.description)}</small></span><button data-action="focus" data-district="${a.district||district}" data-area="${a.area||'care'}">위치</button></div>`).join(''):'<p class="empty">서비스 부족 완화, 시설 전환, 재정 개선을 실제 수치로 확인하면 여기에 기록됩니다.</p>'}</section></div><section class="panel"><div class="panel-title"><h3>진행 중인 사업과 운영</h3><button class="subtle" data-action="history" style="font-size:11px;padding:3px 7px">선택 기록</button></div>${(state.projects||[]).map(p=>`<div class="progress-row"><strong>${esc(projectPolicy(p).name)}</strong> · ${esc(p.district?districts().find(d=>d.id===p.district)?.name:'도시 전체')} · ${p.status==='building'?`${2026+p.readyTurn}년 운영 예정`:p.status==='paused'?'운영 중지':'운영 중'}<span style="float:right">연 ${money(p.status==='active'?projectPolicy(p).upkeep:0)}</span></div>`).join('')||'<p class="empty">아직 시행한 사업이 없습니다. 오른쪽 정책에서 첫 투자를 검토하세요.</p>'}</section></div><aside class="sidebar">${inspector()}${policyPanel()}</aside></main><footer class="footer-note">다온시 복원판 · 교육용 모형이며 실제 정책 효과의 예측이 아닙니다. 자동 저장 · 기존 버전 저장 기록은 보존됩니다.</footer>`;if(window.CityMap){const c=$('#city-canvas');CityMap.render(c,state,district,selected,zoom);CityMap.setPaused?.(paused);CityMap.onSelect=area=>{selected=area;render()}}}
function focus(d,a){close();district=d||district;selected=a||selected;render();$('#city-canvas').scrollIntoView({behavior:'smooth',block:'center'});CityMap.highlight?.(district,selected)}
function policyReview(id){const p=policies.find(x=>x.id===id),target=p.scope==='city'?null:district,st=E.policyStatus(state,id,target);if(!st.canStart){toast(st.reason);return}modalKind='policy';modal(p.name,p.scope==='city'?'도시 전체에 적용':dm().name+'에 투자',`<p>${esc(p.description)}</p><div class="stats"><div class="stat"><span>지금 지출</span><strong>${money(p.cost)}</strong></div><div class="stat"><span>운영 시작</span><strong>${state.year+p.delay}년</strong></div><div class="stat"><span>운영 후 유지비</span><strong>${sign(p.upkeep)}억 / 년</strong></div><div class="stat"><span>투자 후 보유 예산</span><strong>${money(state.cash-p.cost)}</strong></div></div><p class="note">사업 준비 기간에는 새 시설의 공급과 유지비가 발생하지 않습니다. 완공 후에도 실제 이용량은 수요·운영 인력·접근성에 따라 제한됩니다. 이 사업을 선택하면 올해 다른 새 사업은 시행할 수 없습니다.</p>${state.turn+p.delay>8?'<p class="bottleneck">종료 전 완공할 수 없습니다. 이번 도전에서는 투자할 수 없습니다.</p>':''}<p class="note">같은 정책은 같은 대상에 중복 투자할 수 없습니다. ${p.canPause?'운영 중지는 유지비와 효과를 함께 중단하며 투자비는 돌려받지 않습니다.':'완공된 정비 사업은 되돌리지 않습니다.'}</p>`,`<button data-action="close">다시 생각하기</button><button class="primary" data-action="apply" data-id="${id}" data-district="${target||''}">투자 시행</button>`)}
function eventModal(){const e=state.pending;if(!e)return;modalKind='event';modal(e.title,`${state.year}년 · ${e.district?districts().find(d=>d.id===e.district)?.name:'도시 전체'}`,`<p>${esc(e.description)}</p><button class="subtle" style="margin-top:10px" data-action="focus" data-district="${e.district||district}" data-area="${e.area||'care'}">관련 장소 살펴보기</button><p class="intro-box note">발생 조건: ${esc(e.condition||'현재 도시 지표와 진행 시점')}</p>${e.options.map(o=>`<button class="event-option" data-action="resolve" data-id="${o.id}" ${state.cash<o.cost?'disabled':''}><strong>${esc(o.label)}</strong><p>${esc(o.description)}</p><small>즉시 비용 ${money(o.cost)} · ${o.delay?'효과 '+o.delay+'년 뒤':'즉시 반영'}${state.cash<o.cost?' · 예산 부족':''}</small></button>`).join('')}<p class="note" style="margin-top:12px">같은 시드라도 정책과 도시 상태가 달라지면 발생하는 사건이 달라질 수 있습니다.</p>`)}
function annualReport(){const r=state.lastReport;if(!r)return;modalKind='annual';modal(`${state.year}년 도시 결산`,`${state.turn} / 8년 · 변화와 원인`,`${(r.highlights||[]).slice(0,3).map(h=>`<div class="report-highlight"><strong>${esc(h.title)}</strong><p>${esc(h.detail)}</p>${h.area?`<button data-action="focus" data-district="${h.district||district}" data-area="${h.area}">지도에서 확인</button>`:''}</div>`).join('')}<div class="stats"><div class="stat"><span>운영 수입 / 지출</span><strong>${num(r.income)} / ${num(r.expenses)}억</strong></div><div class="stat"><span>인구 증감</span><strong>${sign(r.populationAfter-r.populationBefore)}명</strong></div></div><p class="note">이 기간 별도 투자: 정책 ${money(r.investment)} · 사건 대응 ${money(r.eventInvestment)}. 운영 지출은 시설 유지비를 포함합니다.</p><details><summary>인구 계산과 결산 순서</summary><p class="note">출생 ${num(r.births)} − 사망 ${num(r.deaths)} + 외부 전입 ${num(r.inflow)} − 외부 전출 ${num(r.outflow)}<br>지연 사건 효과 → 사업 완공 → 시설 운영 → 재정 결산 → 인구 변화 → 성취·사건 확인. 내부 이사는 이 모형에서 계산하지 않습니다.</p></details>`,`<button class="primary" data-action="${state.phase==='complete'?'ending':state.pending?'event':'close'}">${state.phase==='complete'?'최종 결말 보기':state.pending?'도시의 제안 확인':'도시로 돌아가기'}</button>`)}
function ending(){const m=E.metrics(state),b=E.baseline(state),bm=b.population!==undefined&&b.districts?E.metrics(b):b,end=E.ending(state),ev=E.evaluate(state);modalKind='ending';const rows=[['인구',bm.population,m.population,'명'],['실제 취업',bm.employed,m.employed,'명'],['실제 입주',bm.occupiedHomes,m.occupiedHomes,'호'],['서비스 충족',pct(bm.coverage),pct(m.coverage),''],['의료 접근성',pct(bm.healthAccess),pct(m.healthAccess),''],['보유 재정',b.cash??bm.cash??0,state.cash,'억'],['연간 수지',bm.annualBalance,m.annualBalance,'억']];modal(end.title,`${scenarioName(state.scenario)} · 시드 ${state.seed} · ${ev.success?'목표 달성':'목표 일부 미달'}`,`<p class="intro">${esc(end.description)}</p><div class="table-scroll"><table><thead><tr><th>도시의 변화</th><th>초기</th><th>최종</th></tr></thead><tbody>${rows.map(r=>`<tr><th>${r[0]}</th><td>${typeof r[1]==='number'?num(r[1]):r[1]}${r[3]}</td><td>${typeof r[2]==='number'?num(r[2]):r[2]}${r[3]}</td></tr>`).join('')}</tbody></table></div>${checks()}<h3 style="margin-top:14px">감수한 것, 남은 과제</h3>${(end.remaining||[]).map(x=>`<p class="bottleneck">${esc(x)}</p>`).join('')}<div class="intro-box"><strong>다음 도전의 실마리</strong><p>${esc(end.suggestion)}</p></div><details><summary>주요 선택과 전환점</summary>${historyContent()}</details><details><summary>연도별 추세</summary>${trendTable()}</details><details><summary>이전 도전과 비교 (${(state.archives||[]).length}회)</summary>${archiveContent()}</details><p class="note">같은 조건 재도전은 시나리오·시드·목표를 유지합니다. 새로운 조건에서는 시나리오와 시드를 바꿀 수 있습니다. 영구 능력치 보상은 없습니다.</p>`,`<button data-action="close">완성된 도시 둘러보기</button><button data-action="new">새로운 조건</button><button class="primary" data-action="retry">같은 조건 재도전</button>`,true)}
function historyContent(){return `<h3>시행한 사업</h3>${(state.projects||[]).map(p=>`<div class="history-row">${2026+p.startedTurn}년 · ${esc(projectPolicy(p).name)} · ${esc(p.district?districts().find(x=>x.id===p.district)?.name:'도시 전체')} → ${2026+p.readyTurn}년 운영</div>`).join('')||'<p class="empty">시행한 사업 없음</p>'}<h3 style="margin-top:12px">사건 대응</h3>${(state.events||[]).map(e=>`<div class="history-row">${2026+e.turn}년 · ${esc(e.title)} → ${esc(e.label||e.choice)}<br><span class="note">${esc(e.description||'')} · 비용 ${money(e.cost)} · ${e.applied?'반영 완료':(2026+e.readyTurn)+'년 반영 예정'}</span></div>`).join('')||'<p class="empty">아직 대응한 사건이 없습니다.</p>'}`}
function trendTable(){return `<div class="table-scroll"><table><thead><tr><th>시점</th><th>인구</th><th>재정</th><th>서비스 충족</th></tr></thead><tbody>${(state.history||[]).map(h=>`<tr><td>${h.year||2026+h.turn}년</td><td>${num(h.population)}</td><td>${money(h.cash)}</td><td>${pct(h.coverage)}</td></tr>`).join('')}</tbody></table></div>`}
function archiveContent(){return (state.archives||[]).map(a=>`<div class="history-row"><strong>${esc(a.title||a.ending?.title||scenarioName(a.scenario))}</strong> · ${esc(scenarioName(a.scenario))} · 시드 ${esc(a.seed)}<br>인구 ${num(a.population??a.metrics?.population)} · 재정 ${money(a.cash)} · 서비스 ${pct(a.coverage??a.metrics?.coverage)} · ${a.success?'목표 달성':'목표 미달'}<br><span class="note">${esc((a.policies||a.projects||[]).map(p=>typeof p==='string'?p:projectPolicy(p).name).join(' → '))}</span></div>`).join('')||'<p class="empty">다음 재도전부터 이전 결과가 이곳에 남습니다.</p>'}
function compare(){const b=E.baseline(state),ds=E.districtMetrics(b),list=Array.isArray(ds)?ds:Object.values(ds),before=list.find(d=>d.id===district),now=dm();modal('같은 생활권, 달라진 도시',`${now.name} · 초기와 ${state.year}년 비교`,`<table><thead><tr><th>지표</th><th>초기</th><th>현재</th></tr></thead><tbody>${[['인구','population'],['입주','occupiedHomes'],['취업','employed'],['서비스 이용','serviceUsed'],['가동 공급','effectiveCapacity'],['미충족','unmet']].map(([label,key])=>`<tr><th>${label}</th><td>${num(before[key])}</td><td>${num(now[key])}</td></tr>`).join('')}</tbody></table><p class="note">이 보기는 기록을 비교하며 실제 게임 상태나 지도 시간을 바꾸지 않습니다.</p>${historyContent()}`)}
function help(){modal('도시 운영 안내','한 턴은 1년, 총 8년입니다.',`<p>① 생활권과 시설을 선택해 공실·일자리·서비스 병목을 살펴보세요.</p><p>② 정책의 투자비, 운영 시점, 유지비를 확인하고 시행하세요. 연간 새 사업은 1개, 진행 중 공사는 1개까지입니다.</p><p>③ 다음 해로 진행해 실제 운영과 결산을 확인하세요. 발생한 제안에 대응하면 다음 턴을 진행할 수 있습니다.</p><p>④ 결말에서 성과와 남은 과제를 비교하고 같은 조건 또는 새로운 조건으로 재도전하세요.</p><div class="intro-box note">정책 전체 보기를 통해 기본 대응 6개에 항상 접근할 수 있습니다. 추천은 무작위 덱이 아닙니다. 사업 중복 투자는 불가능하며 일부 운영 정책만 중지·재개할 수 있습니다. 완공이 인구 증가나 최대 이용을 보장하지 않습니다.</div><h3>사건과 성취의 조건</h3><p class="note">사건은 2·4·6년차에만 현재 지표에 맞는 후보 중 시드로 결정합니다. 같은 사건은 한 판에 반복되지 않으며 제안당 무료 대응이 있습니다. 기업 제안: 빈집 35호 미만·빈 일자리 30개 이상 / 빈집 정비: 빈집 45호 이상 / 돌봄 요청: 미충족 15명 이상 / 의료 협력: 의료 접근 75% 미만 / 시설 재배치: 가동 정원 여유 8명 이상 / 직업학교: 노동 공급과 취업 차이 80명 이상.</p><p class="note">성취는 결산 때 확인합니다. 돌봄 공백 완화: 초기 85% 미만 지역의 충족률 85% 달성. 주거 회복: 초기보다 실제 입주 20호 초과 증가. 시설 새 역할: 재편 운영 중이며 충족률 70% 이상. 지속가능한 개선: 도시 충족률 초기 대비 15%p 이상 개선과 확정 사업 반영 비적자 운영.</p><p class="note">도트 사람·차량은 이용 상태를 표현하는 연출입니다. 장식용 사람 한 명이 주민 한 명을 뜻하지 않습니다. 도시 전체 서비스는 수요에 따라 합산합니다. 게임 수치는 실제 정책 효과 예측이 아닙니다.</p>`)}
function exportSave(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`daon-${state.scenario}-${state.seed}-${state.year}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importSave(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{if(!input.files[0])return;if(input.files[0].size>2*1024*1024)throw Error('저장 파일은 2MB 이하만 불러올 수 있습니다.');const restored=E.restore(JSON.parse(await input.files[0].text()));if(!restored)throw Error('지원하지 않거나 손상된 저장 파일입니다.');window.__pendingImport=restored;modal('저장 파일 불러오기',`${scenarioName(restored.scenario)} · ${restored.year}년 · 시드 ${restored.seed}`,`<p>확인하면 현재 자동 저장을 이 파일로 바꿉니다. 기존 진행을 남기려면 먼저 저장 파일을 내보내세요.</p>`,`<button data-action="export">현재 기록 내보내기</button><button data-action="close">취소</button><button class="primary" data-action="confirm-import">이 기록 이어하기</button>`)}catch(e){toast(e.message||'저장 파일을 읽을 수 없습니다.')}};input.click()}
async function action(el){const a=el.dataset.action;if(busy)return;try{switch(a){case'close':close();break;case'scenario':{startGoal=$('#start-goal')?.value||startGoal;startScenario=el.dataset.id;startGoal=scenarios.find(s=>s.id===startScenario)?.goal||startGoal;const seed=$('#start-seed')?.value;startForm(!!state);if(seed)$('#start-seed').value=seed;break}case'start':{const goal=$('#start-goal').value,seed=Number($('#start-seed').value);if(!Number.isInteger(seed)||seed<0||seed>4294967295||$('#start-seed').value.trim()==='')throw Error('시드는 0부터 4294967295 사이의 정수로 입력하세요.');state=state?E.retry(state,goal,startScenario,seed):E.initial(goal,startScenario,seed);district='oldtown';selected='care';allPolicies=false;close();save();render();toast('도시 운영을 시작합니다. 목표와 첫 투자 기회를 확인하세요.');break}case'district':district=el.dataset.id;render();break;case'area':selected=el.dataset.id;render();break;case'zoom':zoom=Number(el.dataset.value);render();break;case'pause':paused=!paused;render();break;case'all':allPolicies=!allPolicies;render();break;case'policy':policyReview(el.dataset.id);break;case'apply':{const p=policies.find(x=>x.id===el.dataset.id);state=E.startPolicy(state,p.id,el.dataset.district||null);selected=p.area||projectArea(p);close();save();render();CityMap.highlight?.(district,selected);toast(p.name+' 사업을 시행했습니다.');break}case'toggle':state=E.togglePolicy(state,el.dataset.id,policies.find(p=>p.id===el.dataset.id).scope==='city'?null:district);save();render();toast('운영 상태를 변경했습니다. 유지비와 효과를 확인하세요.');break;case'next':busy=true;state=E.nextYear(state);save();render();annualReport();setTimeout(()=>busy=false,350);break;case'event':eventModal();break;case'resolve':busy=true;state=E.resolveEvent(state,el.dataset.id);close();save();render();toast('대응을 기록했습니다. 선택 기록에서 효과 시점을 확인할 수 있습니다.');setTimeout(()=>busy=false,350);break;case'focus':focus(el.dataset.district,el.dataset.area);break;case'ending':ending();break;case'retry':state=E.retry(state,state.goal,state.scenario,state.seed);district='oldtown';selected='care';allPolicies=false;close();save();render();toast('같은 초기 조건과 시드로 재도전합니다.');break;case'new':startScenario=state.scenario;startGoal=state.goal;startForm(true);break;case'goals':modal('이번 도전의 목표','목표 달성과 기본 재정·서비스 조건을 함께 평가합니다.',checks()+`<p class="intro-box note">${state.goal==='resilience'?'인구 증가 대신 돌봄·의료 접근성과 지속가능한 재정을 개선하세요.':'주거와 일자리의 빈틈을 함께 해결해 정착과 취업을 개선하세요.'}</p>`);break;case'compare':compare();break;case'history':modal('도시에 남은 선택',`${state.year}년 · 사업과 사건`,historyContent()+trendTable(),'',true);break;case'help':help();break;case'save':save();modal('진행 기록 저장','매 선택과 결산 후 자동 저장됩니다.',`<p>현재 진행: ${state.year}년 · ${scenarioName(state.scenario)} · 시드 ${state.seed}</p><p class="note">다른 브라우저나 환경으로 옮기려면 JSON 파일을 내보내세요. 이전 버전 기록은 삭제하지 않습니다.</p>`,`<button data-action="import">파일 불러오기</button><button class="primary" data-action="export">파일 내보내기</button>`);break;case'export':if(state)exportSave();break;case'import':importSave();break;case'confirm-import':state=window.__pendingImport;delete window.__pendingImport;close();save();render();toast('저장된 도시를 복원했습니다.');break}}catch(e){busy=false;toast(e.message||String(e));console.error(e)}}
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(el&&!el.disabled)action(el)});document.addEventListener('keydown',event=>{if(event.key==='Escape')close()});window.DaonGame={getState:()=>state?JSON.parse(JSON.stringify(state)):null,getMetrics:()=>state?E.metrics(state):null,getDistricts:()=>state?districts():[],storageKey:KEY};render();if(restoreNotice)toast(restoreNotice);
})();
</script></body></html>
