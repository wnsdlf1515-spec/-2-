<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#12625c"><title>다온시 리부트 · 우리 반이 도시를 살린다</title><style>:root{
  --ink:#193f38;
  --muted:#60716a;
  --teal:#12665d;
  --teal-dark:#104e47;
  --paper:#f6f4ee;
  --line:#d9dfd5;
  --white:#fffefa;
  --amber:#83591e;
  --red:#a4393c;
  --shadow:0 10px 30px #153d3110;
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color:var(--ink);
  background:var(--paper);
  font-synthesis:none
}
*{
  box-sizing:border-box
}
body{
  margin:0;
  font-size:24px;
  line-height:1.6
}
button,input,textarea,select{
  font:inherit
}
button{
  cursor:pointer;
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 20px;
  background:var(--white);
  color:var(--ink);
  font-weight:700;
  line-height:1.35;
  transition:background .12s,box-shadow .12s
}
button:hover:not(:disabled){
  background:#e8eee4
}
button:focus-visible,summary:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{
  outline:3px solid #dba33d;
  outline-offset:4px
}
button:disabled{
  opacity:.45;
  cursor:not-allowed
}
button.primary{
  background:var(--teal);
  border-color:var(--teal);
  color:#fff
}
button.primary:hover:not(:disabled){
  background:var(--teal-dark)
}
button.secondary{
  background:transparent;
  border-color:#a2b8ae
}
button.quiet{
  background:transparent;
  border-color:transparent;
  padding:8px 12px
}
button.small{
  font-size:16px;
  padding:7px 11px;
  border-radius:8px
}
button.full{
  width:100%
}
button.selected-button{
  background:#dfefe5;
  border:2px solid var(--teal);
  color:var(--teal)
}
button.remove{
  font-size:26px;
  padding:0 7px;
  border:0;
  background:none
}
p{
  margin:0 0 18px
}
h1,h2,h3{
  line-height:1.3;
  letter-spacing:-.035em;
  word-break:keep-all
}
h1{
  font-size:44px;
  margin:0 0 24px
}
h2{
  font-size:30px;
  margin:10px 0 16px
}
h3{
  font-size:28px;
  margin:10px 0 18px
}
em{
  font-style:normal
}
a{
  color:var(--teal)
}
.muted,.caption{
  color:var(--muted)
}
.caption{
  font-size:16px;
  line-height:1.7
}
.eyebrow{
  font-size:15px;
  font-weight:800;
  letter-spacing:.08em;
  color:var(--teal)
}
.tag{
  display:inline-flex;
  font-size:17px;
  line-height:1.5;
  padding:5px 12px;
  border-radius:7px;
  font-weight:700
}
.amber{
  background:#f4e7ce;
  color:#73501e
}
.green{
  background:#dcecdf;
  color:#285c3b
}
.negative-text{
  color:var(--red)
}
.coin{
  font-size:.75em;
  color:#b38942
}
.skip-link{
  position:fixed;
  top:-100px;
  left:12px;
  background:#fff;
  padding:10px;
  z-index:100
}
.skip-link:focus{
  top:12px
}
.topbar{
  max-width:1600px;
  margin:0 auto;
  padding:22px 42px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
  gap:16px
}
.brand{
  display:flex;
  align-items:center;
  gap:13px;
  font-size:25px;
  letter-spacing:-1px;
  line-height:1.3
}
.brand small{
  display:block;
  font-size:11px;
  letter-spacing:.01em;
  color:var(--muted);
  margin-top:4px
}
.brand-mark{
  width:40px;
  height:40px;
  display:flex;
  gap:4px;
  align-items:flex-end;
  border-bottom:3px solid var(--teal);
  padding-bottom:4px
}
.brand-mark i{
  width:10px;
  background:var(--teal);
  border-radius:3px 3px 0 0;
  height:28px
}
.brand-mark i:nth-child(2){
  height:37px
}
.brand-mark i:nth-child(3){
  height:20px;
  background:#bd9257
}
.topbar nav{
  display:flex;
  gap:6px;
  font-size:17px
}
.home,.game{
  max-width:1520px;
  margin:auto;
  padding:40px 42px
}
.home{
  padding-top:40px
}
.live-dot{
  display:inline-block;
  width:8px;
  height:8px;
  background:#2c8f77;
  border-radius:50%;
  margin-right:7px
}
.hero-grid{
  display:grid;
  grid-template-columns:1fr 1.15fr;
  gap:42px;
  align-items:center;
  margin:38px 0 45px
}
.kicker{
  font-size:19px;
  color:var(--muted);
  margin-bottom:18px
}
.hero-grid h1{
  font-size:clamp(40px,4vw,64px);
  line-height:1.3;
  letter-spacing:-.065em
}
.hero-grid h1 em{
  color:var(--teal)
}
.hero-text{
  font-size:23px;
  line-height:1.9;
  color:#4c6258;
  margin:24px 0
}
.hero-actions{
  display:flex;
  gap:12px;
  margin:28px 0 14px;
  flex-wrap:wrap
}
.hero-actions button{
  font-size:22px;
  padding:18px 24px
}
.city-card{
  border:1px solid #d5dfd3;
  border-radius:24px;
  background:#e8efe8;
  padding:25px 22px 20px;
  overflow:hidden;
  box-shadow:var(--shadow);
  position:relative
}
.city-label{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  font-weight:700;
  letter-spacing:.08em;
  padding:0 8px
}
.city-art{
  display:block;
  width:100%;
  height:auto;
  margin:8px auto
}
.city-art.large{
  min-height:230px
}
.city-card>p{
  text-align:center;
  margin:20px 0 10px;
  font-size:24px;
  line-height:1.6
}
.city-legend{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  font-size:12px
}
.city-legend i{
  width:7px;
  height:7px;
  display:inline-block;
  border-radius:50%;
  margin-right:4px
}
.home-facts{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:22px 0;
  gap:30px
}
.home-facts>div{
  display:flex;
  flex-direction:column;
  border-right:1px solid var(--line);
  padding:0 20px
}
.home-facts>div:first-child{
  padding-left:0
}
.home-facts>div:last-child{
  border:0
}
.home-facts strong{
  font-size:24px
}
.home-facts span{
  font-size:17px;
  color:var(--muted);
  margin-top:5px
}
.intro-data{
  margin-top:28px
}
.intro-data>p{
  margin-top:16px
}
.intro-data summary{
  font-size:20px
}
.page-footer{
  max-width:1520px;
  margin:auto;
  padding:24px 42px;
  font-size:13px;
  display:flex;
  justify-content:space-between;
  gap:20px;
  color:var(--muted);
  border-top:1px solid var(--line)
}
.goal-guide{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  margin:24px 0
}
.goal-guide span{
  background:#e6eee5;
  border-radius:8px;
  padding:5px 12px;
  font-size:20px
}
.restore-note{
  font-size:17px;
  border-left:3px solid var(--teal);
  padding-left:12px
}
.game{
  padding-top:24px;
  padding-bottom:36px
}
.game-heading{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:18px
}
.game-heading h1{
  font-size:34px;
  margin:6px 0 16px
}
.game-heading h1 span{
  color:var(--muted);
  font-size:24px;
  margin-left:15px;
  font-weight:500
}
.clock{
  display:flex;
  align-items:center;
  gap:6px
}
.clock>span{
  font-variant-numeric:tabular-nums;
  font-size:32px;
  font-weight:800;
  padding-right:6px
}
.turn-route{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:8px 0 20px
}
.turn-route>span{

  background:#eceee5;
  padding:7px 13px;
  border-radius:8px
}
.turn-route>span.current{
  background:var(--teal);
  color:white
}
.turn-route b{
  margin-right:5px
}
.metrics{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:12px;
  margin:20px 0 8px
}
.metric{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px 18px;
  border-top:4px solid var(--dept)
}
.metric-name{
  font-size:21px;
  font-weight:700;
  white-space:nowrap;
  letter-spacing:-.06em
}
.metric-value{
  display:flex;
  gap:12px;
  align-items:baseline
}
.metric-value strong{
  font-size:43px;
  line-height:1.55;
  letter-spacing:-2px;
  font-variant-numeric:tabular-nums
}
.metric-value>span{
  font-size:15px;
  color:var(--muted)
}
.metric-value .delta{
  font-size:21px;
  font-weight:800;
  color:var(--teal)
}
.metric-value .down{
  color:var(--red)
}
.meter{
  height:6px;
  background:#e8ebe2;
  position:relative;
  border-radius:4px
}
.meter span{
  height:100%;
  display:block;
  background:var(--dept);
  border-radius:4px
}
.meter i{
  position:absolute;
  top:-2px;
  height:10px;
  border-left:2px solid #102d25
}
.metric-target{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:var(--muted);
  margin-top:8px;
  gap:4px
}
.goal-strip{
  display:flex;
  align-items:center;
  gap:5px;
  margin-bottom:20px;
  font-size:16px
}
.goal-strip>span{
  flex:1;
  color:var(--muted)
}
.event-panel{
  display:grid;
  grid-template-columns:1.1fr 1fr;
  gap:30px;
  background:#fff9ee;
  border:1px solid #e7dcc5;
  border-radius:16px;
  padding:22px 26px;
  margin:20px 0 32px
}
.event-intro h2{
  font-size:28px;
  margin:8px 0
}
.event-intro p{
  font-size:20px;
  margin-bottom:0;
  color:#675e49
}
.event-effects{
  font-size:19px;
  border-left:1px solid #e0d6c2;
  padding-left:26px
}
.event-effects>div{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:8px
}
.event-effects>div>b{
  min-width:80px;
  font-size:16px
}
.event-effects details{
  font-size:17px
}
.event-effects details p{
  margin-top:8px
}
.effect{
  font-size:17px;
  display:inline-block;
  padding:3px 8px;
  border-radius:6px;
  color:#285d4a;
  background:#edf3e8;
  margin:2px 4px 2px 0;
  white-space:nowrap;
  line-height:1.5
}
.effect.negative{
  background:#fae9e4;
  color:#9d3e39
}
.effect b{
  font-size:1.08em;
  margin-left:2px
}
.meeting-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 305px;
  gap:24px;
  align-items:start
}
.section-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px
}
.section-heading h2{
  margin:4px 0 16px;
  font-size:28px
}
.hint{
  font-size:15px;
  color:var(--muted)
}
.department-tabs{
  display:flex;
  border-bottom:1px solid var(--line);
  gap:0;
  margin:8px 0 16px
}
.department-tabs button{
  flex:1;
  border:0;
  border-bottom:3px solid transparent;
  border-radius:0;
  background:transparent;
  font-size:17px;
  padding:13px 5px;
  color:var(--muted);
  word-break:keep-all;
  letter-spacing:-.04em
}
.department-tabs button.active{
  border-bottom-color:var(--teal);
  color:var(--teal);
  font-weight:800
}
.department-question{
  font-size:21px;
  margin:10px 0 18px;
  color:#425f52
}
.policy-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px
}
.policy-card{
  display:flex;
  flex-direction:column;
  border:2px solid #dce1d7;
  border-radius:17px;
  padding:22px 22px 18px;
  background:var(--white);
  box-shadow:0 4px 8px #173b2503;
  min-width:0
}
.policy-card.selected{
  border-color:var(--teal);
  box-shadow:0 0 0 2px #cee2d5
}
.card-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px
}
.card-id{
  color:var(--dept);
  font-size:14px;
  font-weight:800
}
.card-top strong{
  font-size:29px;
  line-height:1.1
}
.card-top small{
  font-size:14px;
  margin-left:4px
}
.policy-card h3{
  font-size:28px;
  margin:20px 0 12px
}
.policy-purpose{
  font-size:24px;
  line-height:1.7;
  flex:1
}
.card-effects{
  margin:10px 0 12px;
  font-size:18px
}
.card-effects>div{
  margin-bottom:12px
}
.card-effects dt{
  font-size:15px;
  color:var(--muted);
  font-weight:700;
  margin-bottom:3px
}
.card-effects dd{
  margin:0
}
.card-effects .effect{
  font-size:18px
}
.upkeep{
  display:flex;
  justify-content:space-between;
  gap:10px;
  border-top:1px solid var(--line);
  padding:12px 0;
  font-size:16px
}
.policy-card details{
  font-size:20px;
  margin:0 0 20px
}
.policy-card details>p{
  font-size:22px;
  margin:12px 0
}
.policy-card summary{
  font-size:17px;
  color:var(--teal)
}
summary{
  cursor:pointer;
  font-weight:650;
  line-height:1.5
}
summary:hover{
  color:var(--teal)
}
.policy-card>button{
  margin-top:auto;
  width:100%;
  font-size:23px
}
.synergy-note{
  background:#ecf2e7;
  padding:14px;
  border-radius:10px;
  margin:14px 0
}
.synergy-note p{
  margin:8px 0;
  font-size:21px
}
.synergy-note small{
  display:block;
  font-size:14px;
  margin-top:6px
}
.locked-reason{
  font-size:15px;

  color:var(--muted)
}
.budget-panel{
  background:#eaf0e7;
  border:1px solid #d6e0d1;
  border-radius:16px;
  padding:22px;
  position:sticky;
  top:18px;
  font-size:18px
}
.budget-value{
  font-size:52px;
  font-weight:800;
  line-height:1.4;
  letter-spacing:-2px
}
.budget-value small{
  font-size:18px;
  margin-left:7px;
  font-weight:500
}
.budget-equation{
  font-size:14px;
  color:var(--muted);
  margin:2px 0 14px
}
.budget-line{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  gap:8px
}
.budget-line strong{
  font-size:23px
}
.budget-line.balance{
  border-top:1px solid #cddac8;
  border-bottom:1px solid #cddac8
}
.selection-list{
  padding:0;
  list-style:none;
  margin:16px 0
}
.selection-list li{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  font-size:17px;
  line-height:1.5;
  margin:10px 0
}
.future-budget{
  display:flex;
  justify-content:space-between;

  padding:13px;
  background:#dce8d7;
  border-radius:9px;

  font-size:17px
}
.future-budget small{
  display:block;
  width:100%;

  font-size:14px
}
.input-label{
  display:block;
  font-size:17px;
  font-weight:700
}
.input-label span{
  font-size:12px;
  font-weight:400;
  color:var(--muted)
}
textarea{
  width:100%;
  min-height:100px;
  padding:12px;
  border:1px solid #b4c3b7;
  border-radius:9px;
  background:var(--white);
  font-size:20px;
  line-height:1.6;
  resize:vertical;
  color:var(--ink)
}
.budget-panel textarea{
  margin-top:7px;
  font-size:18px
}
.budget-panel .caption{
  font-size:13px;
  margin:5px 0 12px
}
.active-policies{
  font-size:15px;
  margin:14px 0 0
}
.active-policies p{
  margin-top:10px;

}
.discussion-prompt{

}
.discussion-prompt p{
  font-size:21px;
  margin:4px 0 12px
}
.discussion-prompt button{
  font-size:18px
}
.decision-dock{
  position:sticky;
  bottom:12px;
  z-index:4;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  background:#173f38;
  color:white;
  border-radius:16px;
  padding:18px 24px;
  box-shadow:0 6px 25px #113d3930;
  margin:20px 0
}
.decision-dock>div{
  display:flex;
  flex-direction:column
}
.decision-dock b{
  font-size:23px
}
.decision-dock span{
  font-size:15px;
  color:#d2e3da
}
.decision-dock button.primary{
  background:#f6e0ab;
  border-color:#f6e0ab;
  color:#254333;
  font-size:23px
}
.decision-dock button.primary:hover:not(:disabled){
  background:#ffedc5
}
.save-status{
  font-size:13px;
  color:var(--muted);
  text-align:right;
  margin-top:20px
}
.result-title{
  margin:24px 0
}
.result-title h2{
  font-size:34px;
  margin:14px 0
}
.result-title>p{
  font-size:22px;
  color:var(--muted)
}
.result-explanation{
  padding:26px 30px;
  background:#e5eee3;
  border:1px solid #cedcc9;
  border-radius:16px;
  margin-bottom:24px
}
.result-explanation p{
  font-size:24px
}
.result-explanation .question{
  margin-bottom:0
}
.question{
  font-weight:700;
  margin-top:20px;
  color:var(--teal)
}
.synergy-result{
  border-top:1px solid #c5d6c3;
  padding-top:12px;
  color:var(--teal)
}
.result-budget{

  flex-wrap:wrap;
  padding:16px 0;
  font-size:22px
}
.table-scroll{
  overflow-x:auto
}
table{

  border-collapse:collapse;
  text-align:left;
  background:var(--white);
  font-size:20px
}
caption{
  text-align:left;
  padding:14px 0;
  font-weight:700;
  font-size:24px
}
th,td{
  padding:13px 16px;
  border-bottom:1px solid var(--line);
  vertical-align:top
}
thead th{

  font-size:16px;
  white-space:nowrap
}
tbody th{
  font-weight:600
}
table.ledger{
  min-width:850px;
  font-size:20px
}
.ledger th:first-child{
  width:42%;
  font-size:18px
}
.ledger td{

}
.subtotal{

.line-kind{

}
.result-ledger{

  font-size:20px
}
.pending{

  border-radius:12px;

  padding:20px 25px
}
.pending>div{
  margin-top:10px
}

  function policyCard(id,a,state) {
    const c=E.cards[id], selected=a.draft.selected.includes(id), reason=E.selectionError(state,a.scenario,[...a.draft.selected,id]);
    const synergies=R.synergies.map((s,i)=>({...s,index:i})).filter(s=>s.pair.includes(id));
    const locked=!selected&&Boolean(reason);
    return `<article class="policy-card ${selected?'selected':''}" style="--dept:${C.departments[c.department].color}" data-card="${id}"><div class="card-top"><span class="card-id">${id} · 정책 제안</span><strong>${money(c.cost)}<small>칩</small></strong></div><h3>${c.name}</h3><p class="policy-purpose">${C.cards[id][0]}</p><dl class="card-effects"><div><dt>이번 턴</dt><dd>${effects(c.now)}</dd></div><div><dt>${state.turn===2?'종료 이후':'다음 턴'} 1회</dt><dd>${effects(c.next)}</dd></div></dl><div class="upkeep">다음 턴부터 운영비 <b>${c.upkeep}칩 / 턴</b></div><details><summary>상충·연계 확인${synergies.length?' · 시너지 '+synergies.length:''}</summary><p>${C.cards[id][1]}</p>${synergies.map(s=>`<div class="synergy-note"><b>${names(s.pair.filter(x=>x!==id))}와 연결</b><p>${C.synergies[s.index]}</p>${effects(s.effect)}<small>두 정책을 실행한 턴에 한 번만 적용</small></div>`).join('')}${c.upkeep===0?'<p class="caption">운영비 0은 기존 예산 안에서 운영한다는 모형 가정입니다.</p>':''}</details>${button('select',selected?'✓ 선택됨 · 취소':'이 정책 선택',selected?'selected-button':'secondary',`data-id="${id}" aria-pressed="${selected}" ${locked?'disabled':''}`)}${locked?`<p class="locked-reason">${esc(reason)}</p>`:''}</article>`;
  }
  function selection(a,state) {
    const selected=a.draft.selected, spent=E.sum(selected.map(id=>E.cards[id].cost)), nextOperating=E.upkeep([...state.active,...selected]);
    const notes=a.draft.notes, completed=D.filter(d=>notes.departments[d].proposed&&notes.departments[d].reviewed).length;
    return `${state.previous.length?`<div class="arrival-strip"><b>이번 턴에 도착할 이전 정책의 효과</b><div>${effects(state.previous.reduce((v,id)=>E.add(v,E.cards[id].next),E.zero()))}</div><span>아직 위 지표에 더하지 않았습니다. 결과 공개 때 한 번 반영합니다.</span></div>`:''}${eventPanel(a,state)}<section class="meeting-layout"><div class="policy-area"><div class="section-heading"><div><span class="eyebrow">정책회의</span><h2>어떤 변화를 먼저 만들까요?</h2></div><span class="hint">부서당 1장 · 전체 1–3장</span></div><div class="department-tabs" role="tablist" aria-label="정책 부서">${D.map(d=>`<button role="tab" type="button" data-action="department" data-id="${d}" id="tab-${d}" aria-controls="policy-panel" aria-selected="${activeDepartment===d}" tabindex="${activeDepartment===d?'0':'-1'}" class="${activeDepartment===d?'active':''}">${C.departments[d].short}${selected.some(id=>E.cards[id].department===d)?'<span aria-label="정책 선택됨"> ●</span>':''}</button>`).join('')}</div><div role="tabpanel" id="policy-panel" aria-labelledby="tab-${activeDepartment}" tabindex="0"><p class="department-question">${C.departments[activeDepartment].question}</p><div class="policy-grid">${E.hand(state,a.scenario,activeDepartment).map(id=>policyCard(id,a,state)).join('')}</div></div><div class="discussion-prompt"><b>선택되지 않은 부서도 함께</b><p>${C.departments[activeDepartment].review}</p>${button('notes',`제안·교차 검토 기록 ${completed}/5`,'secondary')}</div></div><aside class="budget-panel" aria-label="공동 예산"><span class="eyebrow">공동 예산</span><div class="budget-value">${money(E.funds(state))}<small>칩</small></div><p class="budget-equation">이월 ${state.reserve} + 배정 12 − 운영비 ${E.upkeep(state.active)}</p><div class="budget-line"><span>선택 비용</span><strong>${spent}칩</strong></div><div class="budget-line balance"><span>선택 후 잔액</span><strong>${E.funds(state)-spent}칩</strong></div><ul class="selection-list">${selected.length?selected.map(id=>`<li><span>${esc(E.cards[id].name)}</span>${button('select','×','remove',`data-id="${id}" aria-label="${E.cards[id].name} 선택 취소"`)}</li>`).join(''):'<li class="muted">아직 선택한 정책이 없습니다.</li>'}</ul><div class="future-budget"><span>${state.turn===2?'종료 이후':'다음 턴'} 운영비</span><b>${nextOperating}칩</b>${state.turn<2?`<small>다음 가용액 ${E.funds(state)-spent+12-nextOperating}칩</small>`:'<small>공동 목표: 5칩 이하</small>'}</div><label for="reason" class="input-label">우리의 선택 근거 <span>선택 사항</span></label><textarea id="reason" data-note="reason" maxlength="1000" placeholder="이 정책이 필요한 이유는…">${esc(notes.reason)}</textarea><p class="caption">종이 활동지에 기록해도 됩니다.</p>${button('preview','교사용 예상 결과','quiet full')}<details class="active-policies"><summary>이미 실행한 정책 ${state.active.length}장</summary><p>${state.active.length?names(state.active):'첫 정책을 함께 결정해 주세요.'}</p></details></aside></section><div class="decision-dock"><div><b>${selected.length} / 3장 선택</b><span>선택 후 잔액 ${E.funds(state)-spent}칩 · 다섯 부서의 의견을 확인하세요.</span></div>${button('confirm-open','정책 확정하고 결과 보기 →','primary',selected.length?'':'disabled')}</div>`;
  }
  function ledger(result) {
    return `<div class="table-scroll"><table class="ledger"><caption>어떤 정책과 조건 때문에 달라졌나요?</caption><thead><tr><th scope="col">변화의 원인</th>${D.map(d=>`<th scope="col">${C.departments[d].short}</th>`).join('')}</tr></thead><tbody><tr class="subtotal"><th scope="row">시작 지표</th>${result.before.metrics.map(v=>`<td>${v}</td>`).join('')}</tr>${result.lines.map(l=>`<tr><th scope="row"><span class="line-kind">${({delayed:'지연',policy:'정책',synergy:'연계',event:'사건',trend:'기본',clamp:'범위'})[l.kind]}</span>${esc(l.label)}</th>${l.vector.map(v=>`<td class="${v<0?'negative-text':''}">${v?signed(v):'—'}</td>`).join('')}</tr>`).join('')}<tr class="subtotal"><th scope="row">최종 지표</th>${result.after.metrics.map(v=>`<td>${v}</td>`).join('')}</tr></tbody></table></div>`;
  }
  function explanation(result) {
    const low=result.after.metrics.map((v,i)=>({v,i})).sort((a,b)=>a.v-b.v)[0];
    const positive=result.lines.filter(l=>l.vector[low.i]>0), negative=result.lines.filter(l=>l.vector[low.i]<0);
    const synergy=result.lines.filter(l=>l.kind==='synergy');
    return `<div class="result-explanation"><span class="eyebrow">변화 읽기</span><h2>${R.metrics[low.i]} ${result.after.metrics[low.i]}점${result.after.metrics[low.i]<50?' · 다음 논의의 출발점':''}</h2><p>${positive.length?positive.map(l=>`${esc(l.label)} ${signed(l.vector[low.i])}`).join(', '):'이 지표를 직접 개선한 효과는 없었습니다.'}${negative.length?`<br>${negative.map(l=>`${esc(l.label)} ${signed(l.vector[low.i])}`).join(', ')}가 반영됐습니다.`:''} 최종 변화는 <b>${signed(result.delta[low.i])}</b>입니다.</p>${synergy.map(l=>`<p class="synergy-result">✦ ${C.synergies[R.synergies.findIndex(s=>s.pair.join('+')===l.ids.join('+'))]}</p>`).join('')}<p class="question">누구에게 도움이 됐나요? 아직 남은 공백은 무엇인가요?</p></div>`;
  }
  function resultScreen(a,replayed) {
    const r=replayed.results.at(-1), complete=a.phase==='complete', goal=E.goal(r.after);
    return `<section class="result-title"><span class="tag ${complete&&goal.success?'green':'amber'}">${complete?(goal.success?'균형 전환 달성':'전환 목표 미달 · 보완할 조건'):'정책 실행 결과'}</span><h2>${complete?(goal.success?'함께 만든 변화, 다음에도 이어질 수 있을까요?':'이번 선택에서 무엇을 바꿔 볼까요?'):`${r.after.turn}턴, 도시의 생활 여건이 달라졌습니다.`}</h2><p>${names(r.selected)}</p></section>${explanation(r)}${complete?`<section class="goal-checks" aria-label="공동 목표 결과">${goal.checks.map(c=>`<div class="goal-check ${c.pass?'pass':'miss'}"><span>${c.pass?'✓':'↗'} ${c.label}</span><b>${fmt(c.value)} <small>/ ${c.upper?'최대':'최소'} ${c.target}</small></b>${c.pass?'<span>충족</span>':`<span>${fmt(c.gap)} ${c.upper?'초과':'부족'}</span>`}</div>`).join('')}</section>`:''}<div class="result-budget"><b>예산 흐름</b><span>이월 ${r.budget.carry} + 배정 12 − 기존 운영비 ${r.budget.operating} − 새 정책 ${r.budget.spent} = <strong>잔액 ${r.budget.reserve}칩</strong></span><span>이후 운영비 <b>${r.budget.nextOperating}칩 / 턴</b></span></div><details class="result-ledger" open><summary>정책·지연·시너지·사건별 계산 펼쳐 보기</summary>${ledger(r)}</details><div class="pending"><b>${complete?'관찰 기간 이후에 이어질 효과':'다음 턴에 도착할 효과'}</b><div>${effects(r.pending)}</div>${complete?'<p>이번 목표 점수에는 포함되지 않았습니다. 늦게 시작한 장기 정책이 현실에서도 나쁘다는 뜻은 아닙니다.</p>':''}</div>${complete?comparisonSection(a):''}${complete?`<label class="reflection-label" for="reflection">다음 전략: 유지할 것 / 바꿀 것 / 예상 이유</label><textarea id="reflection" data-note="reflection" maxlength="1000" placeholder="다음 도전에서는…">${esc(a.reflection)}</textarea>`:''}<div class="result-actions">${button('undo','직전 확정 취소','secondary')}${game.mode==='practice'?button('end-practice','연습 마치고 처음으로','primary'):complete?`${button('retry-same','같은 조건으로 재도전 →','primary')}${button('retry-new','새로운 조건으로 도전','secondary')}`:button('advance','다음 턴으로 →','primary')}</div>${complete?'<p class="caption">동일 조건 재도전은 예산·능력치 보상 없이 시작합니다. 새로운 조건은 전략 향상의 직접 비교에 쓰지 않습니다.</p>':''}`;
  }
  function comparisonSection(a) {
    if(game.attempts.length<2)return `<section class="compare-intro"><h2>다음 도전의 가설을 세워 주세요.</h2><p>어떤 선택이나 실행 순서를 바꾸면, 어떤 생활 여건이 달라질까요?</p></section>`;
    const prev=game.attempts.at(-2), before=E.replay(prev).state, after=E.replay(a).state, same=E.sameConditions(prev,a);
    return `<section class="comparison"><span class="tag ${same?'green':'amber'}">${same?'같은 초기값·카드 덱·사건 순서':'조건 다름 · 전략 효과를 단정하지 않기'}</span><h2>${prev.id}차 → ${a.id}차 도전 비교</h2><div class="comparison-grid">${D.map((d,i)=>`<div><span>${C.departments[d].short}</span><b>${before.metrics[i]} → ${after.metrics[i]}</b><em>${signed(after.metrics[i]-before.metrics[i])}</em></div>`).join('')}</div><p>잔액 ${before.reserve} → ${after.reserve}칩 · 운영비 ${E.upkeep(before.active)} → ${E.upkeep(after.active)}칩</p><div class="table-scroll"><table><thead><tr><th>턴</th><th>${prev.id}차 정책</th><th>${a.id}차 정책</th></tr></thead><tbody>${a.turns.map((t,i)=>`<tr><th>${i+1}</th><td>${esc(names(prev.turns[i].selected))}</td><td>${esc(names(t.selected))}</td></tr>`).join('')}</tbody></table></div><p class="question">무엇을 바꿨고, 어떤 경로로 결과가 달라졌나요? 현실에서는 어떤 자료가 더 필요한가요?</p></section>`;
  }
  function playing() {
    const a=E.current(game), replayed=E.replay(a), state=replayed.state, selecting=a.phase==='select';
    const shownTurn=selecting?state.turn+1:state.turn;
    return `${toolbar()}<main id="main" class="game"><div class="game-heading"><div><span class="eyebrow">${game.mode==='practice'?'1턴 연습 · 본 수업 기록과 분리':a.scenario.kind==='default'?'공개수업 기본 시나리오':'새 조건 시나리오 · '+a.scenario.seed}</span><h1>${game.mode==='practice'?'연습 정책회의':a.id+'차 도전'} <span>${shownTurn} / 3턴</span></h1></div>${clockHTML()}</div><div class="turn-route">${a.scenario.events.map((id,i)=>`<span class="${i===shownTurn-1?'current':''}"><b>${i+1}</b> ${E.events[id].name}${i<state.turn?' ✓':''}</span>`).join('')}</div>${metrics(state,selecting?null:replayed.results.at(-1).delta)}<div class="goal-strip"><span>공동 목표: 각 지표 ≥50 · 평균 ≥54 · 잔액 ≥2 · 운영비 ≤5</span>${button('city','도시 모습','quiet small')}${button('history','도전 기록','quiet small')}${selecting&&state.turn>0?button('undo','직전 확정 취소','quiet small'):''}</div>${selecting?selection(a,state):resultScreen(a,replayed)}<p id="save-status" class="save-status">${storageError||'이 기기에 자동 저장'}</p></main>${footer()}`;
  }
  function render() {
    document.body.classList.toggle('large-type',Boolean(game?.settings.largeText||saved?.settings.largeText));
    document.body.classList.toggle('paper-mode',paper);
    app.innerHTML=paper?window.DaonMaterials.render(E,C):game?playing():home();
  }
  function resetClock() { clock={remaining:game?.settings.turnSeconds||240,running:false,until:0}; }
  function notesModal() {

    showModal('다섯 부서의 제안과 교차 검토',`<p>정책이 선택되지 않아도 검토 의견을 남깁니다. 종이 활동지로 기록하면 체크만 해도 됩니다.</p><div class="notes-grid">${D.map(d=>`<section><h3>${C.departments[d].name}</h3><div class="check-row"><label><input type="checkbox" data-dept="${d}" data-check="proposed" ${notes.departments[d].proposed?'checked':''}> 제안함</label><label><input type="checkbox" data-dept="${d}" data-check="reviewed" ${notes.departments[d].reviewed?'checked':''}> 다른 부서 검토함</label></div><label for="note-${d}">근거·연계·우려 <span class="muted">선택 사항</span></label><textarea id="note-${d}" maxlength="1000" data-dept="${d}" data-dept-text placeholder="어떤 조건을 보완해야 할까요?">${esc(notes.departments[d].text)}</textarea></section>`).join('')}</div>${button('notes-done','기록하고 회의로','primary')}`);
  }
  function configure(mode='lesson') {
    showModal(mode==='practice'?'1턴 연습':'수업 준비',`<p>${mode==='practice'?'정책 선택과 결과 읽기를 한 번 연습합니다. 끝나면 기록을 분리하고 본 수업을 시작합니다.':'학생은 모둠 활동지와 대형 화면으로 참여합니다. 시간은 교사가 직접 조절합니다.'}</p><form id="settings-form"><label>수업 시간 <input name="minutes" type="number" value="50" min="20" max="120" required> 분</label><label>모둠 수 <input name="groups" type="number" value="5" min="2" max="10" required> 개</label><label>턴 타이머 <input name="turnSeconds" type="number" value="240" min="60" max="600" step="10" required> 초</label><p class="caption">모둠 수가 달라도 다섯 부서 기능은 유지합니다. 합치거나 제안·검토팀으로 나누어 배정하세요.</p><label class="check-row"><input type="checkbox" name="largeText"> 큰 글씨 모드</label><button class="primary" type="submit" data-mode="${mode}">시작하기</button></form>`);
  }
  function download(text,name,type='application/json') {

  }
  function fileMenu() {
    showModal('수업 기록과 화면 설정',`<p>자동 저장은 지금 사용하는 브라우저에 남습니다. 다른 PC에서 이어가려면 파일로 내보내세요.</p><div class="tool-grid">${button('export','수업 기록 내보내기','primary',game||saved?'':'disabled')}${button('import','기록 파일 가져오기','secondary')}${button('backup-restore','이전 백업 복구','secondary')}${button('font','큰 글씨 켜기 / 끄기','secondary')}${button('fullscreen','전체화면 전환','secondary')}${button('new-game','새 수업 시작','secondary')}</div><p class="caption">현재 수업 ${game?.settings.minutes||saved?.settings.minutes||50}분 · ${game?.settings.groups||saved?.settings.groups||5}모둠. 파일 가져오기와 새 수업 전에는 기존 자동 저장 기록을 이전 백업으로 보관합니다.</p><p class="warning">${storageError||startupError||'교실 PC의 브라우저 데이터가 지워지면 자동 저장도 사라집니다. 수업 종료 전 기록 파일을 보관하세요.'}</p>`);
  }
  function help() { showModal('교사 진행 안내',`<ol class="help-steps"><li><b>상황 20초</b> · 이번 사건과 이전 턴의 변화를 읽습니다.</li><li><b>부서 논의 70초</b> · 각자 근거를 한 구절씩 남깁니다.</li><li><b>제안 60초</b> · 부서별 10초, 다른 정책의 영향도 검토합니다.</li><li><b>공동 선택 50초</b> · 1–3장을 고릅니다. 다음 운영비까지 확인합니다.</li><li><b>결과 40초</b> · 원인을 설명하고 다음 턴으로 이동합니다.</li></ol>${goalGuide()}<p>매 턴 배정 12칩, 최초 이월 2칩. 새 정책의 이번 운영은 도입비에 포함됩니다. 다음 턴부터 운영비를 냅니다. 같은 카드는 도전당 한 번만, 부서당 턴당 한 장입니다.</p><p>3턴을 마친 뒤 4분 동안 수정할 전략을 적고, 같은 조건으로 다시 도전하세요. 성공 여부보다 근거·상충 이해·제안 수정 과정을 관찰합니다.</p><p>타이머는 안내용입니다. 끝나도 자동 확정하지 않습니다. 실수한 확정은 되돌릴 수 있습니다.</p>${button('materials','지도안·부서 활동지·규칙 인쇄','primary')}`); }
  function history() {
    showModal('도전별 선택과 판단 기록',game.attempts.map(a=>`<section class="history-attempt"><h3>${a.id}차 도전 ${a.phase==='complete'?(E.goal(E.replay(a).state).success?'· 목표 달성':'· 보완 필요'):'· 진행 중'}</h3><p>${a.scenario.events.map(id=>E.events[id].name).join(' → ')}</p>${a.turns.map((t,i)=>`<details><summary>${i+1}턴 · ${esc(names(t.selected))}</summary><p>공동 근거: ${esc(t.notes.reason||'종이 활동지 또는 구두 논의')}</p>${D.map(d=>`<p><b>${C.departments[d].short}</b> · 제안 ${t.notes.departments[d].proposed?'✓':'미표시'} / 검토 ${t.notes.departments[d].reviewed?'✓':'미표시'}<br>${esc(t.notes.departments[d].text)}</p>`).join('')}${ledger(E.replay(a).results[i])}</details>`).join('')}<p>전략 메모: ${esc(a.reflection||'아직 작성하지 않았습니다.')}</p><p>직전 확정 취소 ${a.undoCount}회 · 취소는 도전 횟수를 늘리지 않습니다.</p></section>`).join(''));
  }
  function act(action,el) {
    if(action==='close') {closeModal();render();return;}
    if(action==='start')return configure();
    if(action==='practice') { if(saved) { showModal('저장한 수업이 있습니다','<p>저장한 수업을 먼저 이어가거나 기록을 내보낸 뒤 새 수업에서 연습해 주세요.</p>'+button('resume','저장한 수업 이어가기','primary'));return; }return configure('practice'); }
    if(action==='resume') {game=E.clone(saved);saved=null;closeModal();resetClock();render();return;}
    if(action==='help')return help();
    if(action==='materials') { closeModal();paper=true;clock.running=false;render();window.scrollTo(0,0);return; }
    if(action==='back') {paper=false;render();window.scrollTo(0,0);return;}
    if(action==='print')return window.print();
    if(action==='file-menu')return fileMenu();
    if(action==='export') {const s=game||saved;if(s)download(E.exportSave(s),`다온시-${s.attempts.length}차-수업기록.json`);return;}
    if(action==='import') {document.getElementById('import-file').click();return;}
    if(action==='backup-restore') {
      const raw=localStorage.getItem(BACKUP);if(!raw)throw new Error('이전 백업이 없습니다. 내보낸 기록 파일을 가져올 수 있습니다.');
      const parsed=E.parseSave(raw);return showModal('이전 백업 복구',`<p>${parsed.attempts.length}차 도전 기록으로 돌아갑니다. 현재 기록은 파일로 내보낸 뒤 복구할 수 있습니다.</p>${button('export','현재 기록 내보내기','secondary')}${button('backup-apply','백업으로 복구','primary')}`);
    }
    if(action==='backup-apply') {const parsed=E.parseSave(localStorage.getItem(BACKUP));backup();game=parsed;saved=null;store();closeModal();resetClock();render();notify('이전 백업을 복구했습니다.');return;}
    if(action==='font') {if(game){game.settings.largeText=!game.settings.largeText;store();}else if(saved){saved.settings.largeText=!saved.settings.largeText;try{localStorage.setItem(KEY,JSON.stringify(saved));}catch{}}else document.body.classList.toggle('large-type');if(game||saved)render();return;}
    if(action==='fullscreen') {if(document.fullscreenElement)document.exitFullscreen().catch(()=>notify('전체화면을 종료하지 못했습니다.'));else document.documentElement.requestFullscreen?.().catch(()=>notify('브라우저 전체화면 기능을 사용해 주세요.'));return;}
    if(action==='new-game')return showModal('새 수업을 시작할까요?',`<p>현재 도전 목록을 새로 시작합니다. 보관할 기록은 먼저 파일로 내보내세요.</p><div class="result-actions">${button('export','현재 기록 내보내기','secondary',game||saved?'':'disabled')}${button('new-apply','새 수업 준비','primary')}</div>`);
    if(action==='new-apply') {backup();game=null;saved=null;store();resetClock();render();configure();return;}
    if(!game)return;
    const a=E.current(game), state=E.replay(a).state;
    if(action==='department') {activeDepartment=el.dataset.id;render();document.getElementById('tab-'+activeDepartment)?.focus();return;}
    if(action==='select') {
      if(a.phase!=='select')return;
      const id=el.dataset.id;const next=a.draft.selected.includes(id)?a.draft.selected.filter(x=>x!==id):[...a.draft.selected,id];
      if(next.length){const error=E.selectionError(state,a.scenario,next);if(error)throw new Error(error);}
      a.draft.selected=next;store();render();return;
    }
    if(action==='notes')return notesModal();
    if(action==='notes-done'){closeModal();store();render();return;}
    if(action==='preview') {
      const r=E.resolve(state,a.scenario,a.draft.selected);return showModal('교사용 예상 결과',`<p>학생들이 먼저 원인과 변화를 예상한 뒤 공개해 주세요. 확정 전이므로 도시 상태는 아직 바뀌지 않습니다.</p>${metrics(r.after,r.delta)}${ledger(r)}`);
    }
    if(action==='confirm-open') {
      const error=E.selectionError(state,a.scenario,a.draft.selected);if(error)throw new Error(error);
      const spent=E.sum(a.draft.selected.map(id=>E.cards[id].cost));
      return showModal('이 정책 조합으로 실행할까요?',`<p class="confirm-policies">${names(a.draft.selected)}</p><p>도입 비용 <b>${spent}칩</b> · 잔액 <b>${E.funds(state)-spent}칩</b><br>이후 운영비 <b>${E.upkeep([...state.active,...a.draft.selected])}칩 / 턴</b></p><p>선택되지 않은 부서의 검토 의견도 들었나요?</p><div class="result-actions">${button('close','다시 논의하기','secondary')}${button('confirm','확정 · 결과 공개','primary')}</div>`);
    }
    if(action==='confirm') {game=E.commit(game);clock.running=false;store();closeModal();render();window.scrollTo(0,0);return;}
    if(action==='advance') {game=E.advance(game);store();resetClock();activeDepartment='Y';render();window.scrollTo(0,0);return;}
    if(action==='undo')return showModal('직전 확정을 되돌릴까요?',`<p>직전 정책 실행과 모든 효과를 함께 되돌립니다. 선택·회의 기록은 수정할 수 있게 복원됩니다. 이번 턴에서 새로 선택 중인 내용은 교체됩니다.</p>${button('undo-apply','직전 확정 되돌리기','primary')}`);
    if(action==='undo-apply'){game=E.undo(game);store();resetClock();closeModal();render();window.scrollTo(0,0);return;}
    if(action==='retry-same'||action==='retry-new') {
      let seed=null;
      if(action==='retry-new'){const bytes=new Uint32Array(1);crypto.getRandomValues(bytes);seed=bytes[0];if(seed===a.scenario.seed)seed=(seed+1)>>>0;}
      game=E.retry(game,seed);store();resetClock();activeDepartment='Y';render();window.scrollTo(0,0);notify(action==='retry-same'?'같은 초기값·덱·사건 순서로 다시 시작합니다.':'새로운 카드·사건 조건입니다.');return;
    }
    if(action==='end-practice'){game=null;saved=null;store();resetClock();render();window.scrollTo(0,0);return;}
    if(action==='clock'){clock.running=!clock.running;if(clock.running)clock.until=Date.now()+clock.remaining*1000;render();return;}
    if(action==='clock-add'){clock.remaining+=30;if(clock.running)clock.until+=30000;render();return;}
    if(action==='clock-reset'){resetClock();render();return;}
    if(action==='city')return showModal('우리의 선택이 바꾸는 생활 공간',`${city(state.metrics,true)}<p>공간의 색과 표시는 다섯 생활 지표의 목표선 도달 여부를 나타냅니다. 인구 증가나 건물 수를 예측하지 않습니다.</p>${metrics(state)}`);
    if(action==='history')return history();
  }
  document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;try{act(el.dataset.action,el);}catch(error){notify(error.message);}});
  document.addEventListener('keydown',e=>{
    if(e.target.getAttribute('role')==='tab'&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){
      e.preventDefault();let i=D.indexOf(activeDepartment);i=e.key==='Home'?0:e.key==='End'?4:(i+(e.key==='ArrowRight'?1:4))%5;act('department',{dataset:{id:D[i]}});
    }
  });
  document.addEventListener('input',e=>{
    if(!game)return;const a=E.current(game),el=e.target;
    if(el.dataset.note==='reason')a.draft.notes.reason=el.value;
    else if(el.dataset.note==='reflection')a.reflection=el.value;
    else if(el.hasAttribute('data-dept-text'))a.draft.notes.departments[el.dataset.dept].text=el.value;
    else if(el.dataset.check)a.draft.notes.departments[el.dataset.dept][el.dataset.check]=el.checked;
    else return;store();
  });
  document.addEventListener('submit',e=>{
    if(e.target.id!=='settings-form')return;e.preventDefault();
    const f=new FormData(e.target);backup();game=E.session({minutes:Number(f.get('minutes')),groups:Number(f.get('groups')),turnSeconds:Number(f.get('turnSeconds')),largeText:f.get('largeText')==='on'},e.submitter.dataset.mode);
    saved=null;store();closeModal();resetClock();activeDepartment='Y';render();window.scrollTo(0,0);
  });
  document.getElementById('import-file').addEventListener('change',async e=>{
    const file=e.target.files[0];e.target.value='';if(!file)return;
    try {if(file.size>2000000)throw new Error('2MB 이하의 기록 파일을 선택해 주세요.');const parsed=E.parseSave(await file.text());
      showModal('기록 파일을 불러올까요?',`<p>${parsed.attempts.length}차 도전 · ${E.current(parsed).turns.length}턴 확정 기록입니다. 현재 기록은 이전 백업으로 보관합니다.</p>${button('export','현재 기록 내보내기','secondary',game||saved?'':'disabled')}<button type="button" id="apply-import" class="primary">이 기록으로 이어가기</button>`);
      document.getElementById('apply-import').onclick=()=>{backup();game=parsed;saved=null;store();closeModal();resetClock();render();notify('기록 파일을 검증하고 복구했습니다.');};
    }catch(error){notify(error.message);}
  });
  setInterval(()=>{
    if(!clock.running)return;clock.remaining=Math.max(0,Math.ceil((clock.until-Date.now())/1000));
    const el=document.getElementById('clock-display');if(el)el.textContent=clockText();
    if(clock.remaining===0){clock.running=false;notify('토론 시간이 끝났습니다. 교사가 다음 진행을 결정해 주세요.');render();}
  },250);
  render();
})();
</script></body></html>
