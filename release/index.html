let pages=page('50분 공개수업 지도안',`<h2>학습 목표</h2><ol><li>저출생·고령화·청년 유출·인구 이동이 생활 서비스와 서로 연결되는 경로를 설명한다.</li><li>정책의 비용·지연 효과·상충·연계를 근거로 공동 선택을 조정한다.</li><li>최초 계획과 최종 계획을 비교하고 정책의 한계와 필요한 현실 자료를 제시한다.</li></ol><table><thead><tr><th>시간</th><th>활동</th><th>관찰할 학습 행동</th></tr></thead><tbody>${rows.map(r=>'<tr>'+r.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')}</tbody></table><p>기본 5모둠. 교사 PC·프로젝터·모둠 활동지·필기구를 준비한다. 실제 모둠 수가 다르면 부서 역할을 합치거나 나눈다. 50분 외 시간은 각 회의 길이를 조정한다.</p><p>공식 성취기준 문구를 인용한 자료가 아니다. 학교가 사용하는 교육과정·교과서와 연결해 최종 지도안을 점검한다.</p>`,1);
pages+=page('교사 진행 안내',`<h2>한 수업, 한 도시 사업</h2><p>재도전·무작위 덱·반복 턴은 없다. 각 부서에서 정확히 1개, 총 5개 정책을 실행한다. 계획과 수정 회의에서는 정책을 자유롭게 교체한다. 집행 전이므로 교체 비용이 없다.</p><h2>예산과 사건을 먼저 알려 주세요</h2><p>총예산 26칩, 집행 한도 22칩. 운영 비용은 운영 이후에 한 번 결산하며 미리 확인할 수 있다. 최종 잔액 = 26 − 집행비 − 운영비. 돌봄 대기 사건은 고정이며 처음부터 예고한다.</p><p>사건 기본 영향: ${eff(E.event.base)}. C2·H1·H2 중 하나가 있으면 ${eff(E.event.mitigated)}로 대체한다. 여러 대응 정책을 선택해도 방어 효과는 중복하지 않는다.</p><h2>진행 대본</h2><ol><li>“왜 이 정책이 필요한가요? 다른 부서에는 어떤 영향이 있나요?”</li><li>“최초 합의를 저장합니다. 돌봄을 기다리는 주민의 상황에서 빈틈을 찾아보세요.”</li><li>“계획을 유지하거나 고친 이유를 적고 최종 확정하겠습니다.”</li><li>“지금은 서비스 개시 시점입니다. 운영 이후에 추가로 바뀌는 것은 무엇일까요?”</li><li>“목표 달성 여부보다 선택의 근거와 아직 남은 공백을 설명해 주세요.”</li></ol><h2>수업 안정성</h2><p>건설 연출은 약 5초이며 건너뛰기가 가능하다. 모든 단계는 수동 진행한다. 시간 초과로 자동 확정하지 않는다. 실수한 입력 취소, JSON 내보내기·가져오기, 자동 저장을 이용한다. 수업 전 학교 PC에서 HTML 열기와 프로젝터 가독성을 확인한다.</p>`,2);
E.D.forEach((d,i)=>{pages+=page(C.departments[d].name+' 활동지',`<p><b>우리 질문:</b> ${C.departments[d].question}</p>${E.R.cards.filter(c=>c.department===d).map(c=>`<article class="paper-card"><h3>${c.id} ${c.name} · 집행 ${c.cost}칩 / 운영 ${c.upkeep}칩</h3><p>${C.cards[c.id][0]}</p><p>즉시: ${eff(c.now)}<br>운영 이후 1회: ${eff(c.next)}</p><p>${C.cards[c.id][1].replaceAll('다음 턴','운영 이후')}</p></article>`).join('')}<p>① 우리 정책과 근거: 어떤 원인에 대응하며 누구에게 도움이 되나요?</p><div class="writing-space"></div><p>② 다른 부서 검토: ${C.departments[d].review}</p><div class="writing-space"></div><p>최초 제안 ______ → 최종 선택 ______　□ 검토 의견을 전달함</p>`,i+3);});
pages+=page('최종 정책회의 · 개인 퇴장표',`<h2>최초 합의와 최종 실행</h2><table><thead><tr><th>부서</th><th>처음</th><th>최종</th><th>유지·변경 이유</th></tr></thead><tbody>${E.D.map(d=>`<tr><td>${C.departments[d].short}</td><td>　　　</td><td>　　　</td><td>　　　　　　　　　</td></tr>`).join('')}</tbody></table><p>최초 계획은 실제 집행하지 않은 비교용 계산이다. 같은 사건 조건에서 비교한다.</p><h2>설명할 수 있나요?</h2><p>1. 인구 구조 변화가 생활 여건에 영향을 주는 경로 하나를 설명하세요.</p><div class="writing-space"></div><p>2. 두 정책을 연결해서 생긴 효과 또는 상충 관계를 설명하세요.</p><div class="writing-space"></div><p>3. 우리 도시의 남은 공백과 현실에서 확인할 자료는 무엇인가요?</p><div class="writing-space"></div><p><b>교사 관찰:</b> 인과 설명 / 근거 제시 / 교차 검토 / 수정 판단. 성공 횟수나 게임 점수로 평가하지 않는다.</p>`,8);
pages+=page('정책 효과 설계표',`<p>벡터 순서: 청년 정착 / 일자리 / 돌봄 / 건강·자립 / 이주·연결. 모두 수업용 가정이다.</p><table><thead><tr><th>정책</th><th>비용</th><th>운영</th><th>즉시</th><th>운영 이후</th></tr></thead><tbody>${E.R.cards.map(c=>`<tr><td>${c.id} ${c.name}</td><td>${c.cost}</td><td>${c.upkeep}</td><td>${c.now.join(', ')}</td><td>${c.next.join(', ')}</td></tr>`).join('')}</tbody></table><p>지연 효과는 운영 이후 시점에 한 번만 더한다. 게임의 관찰 기간은 실제 정책의 동일한 시행 기간을 뜻하지 않는다. 운영비 0은 기존 예산 안에서 운영한다는 가정이다.</p>`,9);
pages+=page('연계·사건·공동 목표',`<h2>연결 효과 — 각 조합당 한 번</h2><table><thead><tr><th>두 정책</th><th>추가 변화</th></tr></thead><tbody>${E.R.synergies.map(l=>`<tr><td>${l.pair.join(' + ')}</td><td>${eff(l.effect)}</td></tr>`).join('')}</tbody></table><h2>계산 순서</h2><ol><li>초기 지표 ${E.R.initial.join(', ')}에서 시작한다.</li><li>정책 즉시 효과와 성립한 연결 효과를 더한다.</li><li>돌봄 대기 사건과 기본 변화 ${E.R.trend.join(', ')}를 한 번 반영한다.</li><li>운영 이후에는 지연 효과를 한 번 더하고 운영비를 한 번 결산한다.</li></ol><p>사건 기본: ${eff(E.event.base)}<br>C2·H1·H2 중 하나 이상일 때: ${eff(E.event.mitigated)}</p><h2>최종 공동 목표</h2><p>각 지표 ≥50 · 평균 ≥52 · 예비비 ≥2 · 이후 운영 부담 ≤5. 최종 시점에 한 번 판정하며 도중에 탈락하지 않는다.</p><p>초기 조합 검사: 243개 중 집행 한도 내 222개, 목표 충족 48개. 이는 학생 승률이나 실제 정책 효과의 증거가 아니다.</p><h2>해석 주의</h2><p>시설·서비스 그림은 인구나 출산율의 예측이 아니다. 특정 세대·성별·이주민을 문제 집단으로 표현하지 않는다. 이 수업은 변화하는 인구 구조에 적응하며 삶의 질과 재정을 함께 고려하는 판단을 다룬다.</p>`,10);
return `<div class="paper-toolbar">${btn('back','게임으로 돌아가기')}${btn('print','인쇄 / PDF 저장','primary')}</div>${pages}`;
};

(()=>{'use strict';
const E=CitySession,C=DaonContent,V=SessionVisuals,app=document.getElementById('app'),dialog=document.getElementById('dialog'),KEY='daon-single-v1';
const labels=['도시 브리핑','계획·협상','위기 대응·수정','도시 건설','운영 이후','최종 회의'];
let s=E.initial(),history=[],department='Y',started=false,paper=false,animate=false,notice='',saved=null,large=false;
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(a,t,cls='',extra='')=>`<button type="button" data-action="${a}" class="${cls}" ${extra}>${t}</button>`;
const fmt=v=>(v>0?'+':'')+v;
const effects=v=>v.map((x,i)=>x?`<span class="effect ${x<0?'negative':''}">${C.departments[E.D[i]].short} ${fmt(x)}</span>`:'').join('');
try{const raw=localStorage.getItem(KEY);if(raw)saved=E.parse(raw);}catch(e){notice='자동 저장을 읽지 못했습니다. 저장 파일을 가져오거나 새 수업으로 시작하세요.';}
function save(){try{localStorage.setItem(KEY,JSON.stringify({state:s,history}));notice='이 브라우저에 자동 저장됨';}catch{notice='자동 저장이 제한되었습니다. 수업 기록을 파일로 내보내 주세요.';}}
function change(next){history.push(E.clone(s));history=history.slice(-60);s=next;save();render();}
function modal(title,body){dialog.innerHTML=`<h2 id="dialog-title">${title}</h2>${body}<div class="modal-actions">${btn('close','닫기')}</div>`;dialog.showModal();}
function toolbar(){return `<header class="topbar"><a class="brand" href="#main"><span class="brand-emblem">D</span><span>다온시 <b>리부트</b><small>하나의 도시, 우리의 결정</small></span></a><nav>${btn('materials','수업 자료','quiet')}${btn('tools','저장·진행 도구','quiet')}${btn('large','큰 글씨','quiet',`aria-pressed="${large}"`)}</nav></header>`;}
function metrics(values){return `<div class="metrics">${E.D.map((d,i)=>`<article style="--dept:${C.departments[d].color}"><span>${C.departments[d].short}</span><strong data-metric="${d}">${values[i]}</strong><div class="meter"><i style="width:${values[i]}%"></i><b></b></div><small>${values[i]>=50?'목표선 도달':'목표까지 '+(50-values[i])} · 기준 50</small></article>`).join('')}</div>`;}
function mission(){return `<div class="mission">공동 미션 <b>각 생활 지표 50↑</b><b>평균 52↑</b><b>예비비 2칩↑</b><b>운영 부담 5칩↓</b></div>`;}
function briefing(){return `<section class="brief-grid"><div><span class="eyebrow">ONE CITY · ONE CLASS</span><h1>다온시의 다음 장면을<br><em>우리 손으로.</em></h1><p class="lead">청년의 정착, 일자리, 돌봄, 건강, 이웃의 연결.<br>다섯 부서가 하나의 도시 사업을 완성합니다.</p><div class="brief-chips"><b>총예산 26칩</b><b>5개 사업</b><b>한 번의 결정</b></div><p>각 부서는 정책 1개를 제안합니다. 집행 한도는 <strong>22칩</strong>. 모두 비싼 사업을 고를 수는 없습니다. 위기 대응 회의에서 계획을 고친 뒤, 도시가 변화하는 모습을 함께 확인하세요.</p><div class="actions">${btn('begin','도시 사업 시작 →','primary')}${saved?btn('resume','저장한 수업 이어가기','secondary'):''}</div><p class="caption">기본 50분 · 교사 PC 1대 · 학생 계정 없이</p></div><div class="home-map">${V.map(s)}<p>텅 빈 도시를 짓는 대신, 기존 생활권의 빈틈을 채웁니다.</p></div></section>${mission()}<section class="intro-grid"><article><h2>도시에서 무슨 일이?</h2><p>다온시는 청년 유출과 고령화 속에서 생활 서비스의 수요가 달라지고 있습니다. 사람이 늘어나는 것만으로는 충분하지 않습니다. 누구나 머물고 살아갈 수 있는 조건을 만드세요.</p></article><article><h2>예고된 위기: 돌봄 대기</h2><p>계획 중 돌봄 서비스 대기 증가를 점검합니다. ${effects(E.event.base)} 대응 정책 C2·H1·H2 중 하나가 있으면 ${effects(E.event.mitigated)}로 완화됩니다.</p><p>사건은 고정되어 있고 피해·대응 조건을 미리 확인할 수 있습니다.</p></article></section><p class="disclaimer">모든 인구 상황·수치·사건은 수업용 가정입니다. 실제 미래 예측이나 학생 평가 점수가 아닙니다.</p>`;}
function budget(r){return `<aside class="budget"><span class="eyebrow">CITY BUDGET</span><h2>공동 예산 <strong>26칩</strong></h2><div class="money ${r.cost>22?'over':''}"><span>사업 집행</span><b>${r.cost} / 22칩</b></div><div class="money"><span>운영 비용 1회</span><b>${r.upkeep}칩</b></div><div class="money ${r.reserve<2?'over':''}"><span>운영 후 예비비</span><b>${r.reserve}칩</b></div><p class="caption">26 − 집행 ${r.cost} − 운영 ${r.upkeep} = ${r.reserve}<br>예비비 2칩 이상 · 운영 부담 5칩 이하</p><ul>${E.D.map(d=>`<li><b>${C.departments[d].short}</b><span>${s.selected[d]?esc(E.cards[s.selected[d]].name):'제안 대기'}</span></li>`).join('')}</ul><p class="budget-hint">싼 정책으로 아낀 칩은 다른 부서의 선택과 운영 여력을 만듭니다.</p></aside>`;}
function board(r){const built=['build','operation','final'].includes(s.phase);return `<section class="city-stage"><div class="board-title"><div><span class="eyebrow">DAON CITY / ${built?'SERVICE OPEN':'MASTER PLAN'}</span><h2>${s.phase==='build'?'계획이 도시의 일상이 됩니다':s.phase==='operation'||s.phase==='final'?'서비스가 이어지는 다온시':'다섯 생활권에 변화를 놓아보세요'}</h2></div><span class="tag">${built?'실행 완료':'반투명 = 미확정 계획'}</span></div>${V.map(s,animate&&s.phase==='build')}<div class="board-bottom"><span>${r.links.length?`✦ ${built?'실행한':'계획한'} 연결 ${r.links.length}개`:'서로 연결할 수 있는 정책을 찾아보세요'}</span>${s.phase==='build'?btn('skip','건설 연출 건너뛰기','light'):''}</div><p class="caption">시설·경로는 정책 서비스를 표현합니다. 건물 수와 인구 증가를 뜻하지 않습니다.</p></section>`;}
function card(id){const c=E.cards[id],chosen=s.selected[c.department]===id,links=E.R.synergies.filter(l=>l.pair.includes(id));return `<article class="policy ${chosen?'chosen':''}" data-card="${id}" style="--dept:${C.departments[c.department].color}"><div class="card-top"><span>${id} · ${V.service[id][0]}</span><b>${c.cost}칩</b></div><h3>${c.name}</h3><p>${esc(C.cards[id][0])}</p><dl><dt>서비스 개시</dt><dd>${effects(c.now)}</dd><dt>운영 이후 1회</dt><dd>${effects(c.next)}</dd></dl><p class="upkeep">운영 부담 ${c.upkeep}칩</p><details><summary>상충·연계 살펴보기</summary><p>${esc(C.cards[id][1].replaceAll('다음 턴','운영 이후'))}</p>${links.map(l=>`<p><strong>${E.cards[l.pair.find(x=>x!==id)].name}</strong>와 연결</p>${effects(l.effect)}`).join('')}${c.upkeep===0?'<p class="caption">운영비 0은 기존 예산 안에서 운영한다는 모형 가정입니다.</p>':''}</details>${btn('choose',chosen?'✓ 이 정책을 제안했어요':'이 정책으로 제안',chosen?'primary':'secondary',`data-id="${id}" aria-pressed="${chosen}"`)}</article>`;}
function notes(){const n=s.notes[department];return `<details class="notes"><summary>${C.departments[department].name} · 제안과 교차 검토 기록</summary><label>우리 제안의 근거<textarea data-note="reason" maxlength="1500">${esc(n.reason)}</textarea></label><label>다른 부서 정책의 영향·연계 의견<textarea data-note="review" maxlength="1500">${esc(n.review)}</textarea></label><label class="check"><input type="checkbox" data-note="checked" ${n.checked?'checked':''}> 다른 부서에 검토 의견을 전했습니다</label><p class="caption">종이 활동지에 적고 체크만 해도 됩니다. 작성 여부는 승리 조건이 아닙니다.</p></details>`;}
function planning(r){return `${s.phase==='response'?`<section class="event-alert"><span class="eyebrow">도시 상황실 / 위기 대응 회의</span><h2>돌봄을 기다리는 일상이 늘었습니다</h2><p>돌봄을 이용할 시간과 이동 경로가 맞지 않으면 가족의 일과 건강에도 공백이 생깁니다. 기존 계획에 남은 빈틈을 찾아 수정하세요.</p><p>${r.protectedBy.length?'현재 계획의 대응 정책: '+r.protectedBy.map(id=>E.cards[id].name).join(', '):'현재 계획에는 이 사건을 완화하는 정책이 없습니다.'}</p><div>${effects(r.protectedBy.length?E.event.mitigated:E.event.base)}</div><p class="caption">아직 집행 전입니다. 추가 비용 없이 계획을 수정할 수 있습니다.</p></section>`:`<details class="event-preview"><summary>예고된 돌봄 대기 사건 · 피해와 대응 조건 확인</summary><p>기본 ${effects(E.event.base)}<br>C2·H1·H2 중 하나를 선택하면 ${effects(E.event.mitigated)}로 대체합니다. 여러 장의 방어 효과를 중복 지급하지 않습니다.</p></details>`}<div class="planning-grid"><section><div class="section-title"><h2>${s.phase==='response'?'연결과 빈틈을 다시 살펴보세요':'우리 부서의 선택은?'}</h2><span>부서당 1개 · 총 5개</span></div><div class="tabs" role="tablist" aria-label="정책 부서">${E.D.map(d=>`<button type="button" role="tab" id="tab-${d}" aria-controls="policies" aria-selected="${d===department}" tabindex="${d===department?0:-1}" data-action="department" data-id="${d}" class="${d===department?'active':''}">${C.departments[d].short}${s.selected[d]?' ✓':''}</button>`).join('')}</div><div id="policies" role="tabpanel" aria-labelledby="tab-${department}"><p class="department-question">${C.departments[department].question}</p><div class="cards">${E.R.cards.filter(c=>c.department===department).map(c=>card(c.id)).join('')}</div></div>${notes()}<p class="participation">교차 검토 기록 ${E.D.filter(d=>s.notes[d].checked).length} / 5부서 · 선택이 끝나도 다른 부서의 영향을 검토해 주세요.</p></section>${budget(r)}</div><div class="decision"><div><strong>${E.selected(s).length} / 5개 사업 제안</strong><span>${E.error(s)||'집행 한도 안입니다. 운영 부담과 남은 예비비도 확인하세요.'}</span></div>${btn('next',s.phase==='plan'?'최초 합의 저장 · 위기 대응으로 →':'최종 계획 확정 · 도시 건설 →','primary',E.error(s)?'disabled':'')}</div>`;}
function ledger(r){return `<details class="ledger"><summary>정책·연계·사건별 계산 근거</summary><div class="table-scroll"><table><caption>초기값 + 원인별 변화 = 최종 생활 여건</caption><thead><tr><th>변화 원인</th>${E.D.map(d=>`<th>${C.departments[d].short}</th>`).join('')}</tr></thead><tbody><tr><th>초기값</th>${E.R.initial.map(v=>`<td>${v}</td>`).join('')}</tr>${r.lines.filter(l=>s.phase!=='build'||l.kind!=='delayed').map(l=>`<tr><th>${esc(l.label)}</th>${l.vector.map(v=>`<td>${v?fmt(v):'—'}</td>`).join('')}</tr>`).join('')}<tr><th>${s.phase==='build'?'서비스 개시':'운영 이후'}</th>${(s.phase==='build'?r.immediate:r.final).map(v=>`<td>${v}</td>`).join('')}</tr></tbody></table></div></details>`;}
function results(r){const operational=s.phase!=='build';return `<section class="result-intro"><span class="eyebrow">${operational?'관찰 시점 2 / 운영 이후':'관찰 시점 1 / 서비스 개시'}</span><h2>${s.phase==='final'?(r.success?'다섯 생활권, 함께 이어갈 기반을 만들었습니다':'도시의 다음 과제가 보입니다'):operational?'시간이 지나 도착한 효과와 운영 비용':'다섯 부서의 사업이 시작됐습니다'}</h2><p>${operational?'지연 효과를 한 번 더하고 운영비를 한 번 지불했습니다.':'현재 지표는 즉시 효과·연계·사건·기본 변화를 반영했습니다. 지연 효과와 운영비 결산은 다음 관찰 시점에 공개합니다.'}</p><p class="caption">한 수업 안에서 두 관찰 시점을 보는 것입니다. 새 턴이나 추가 예산은 없습니다.</p></section>${metrics(operational?r.final:r.immediate)}<div class="result-grid"><article><h3>연결이 만든 변화</h3>${r.links.length?r.links.map(l=>`<p>✦ ${l.pair.map(id=>E.cards[id].name).join(' + ')}<br>${effects(l.effect)}</p>`).join(''):'<p>이번 조합에는 추가 연계 효과가 없습니다.</p>'}<p>${r.protectedBy.length?'대응 정책이 돌봄 대기 사건의 충격을 줄였습니다.':'돌봄 대기 사건의 기본 피해가 반영됐습니다.'}</p></article>${budget(r)}</div>${ledger(r)}${operational?`<section class="goals"><h2>${s.phase==='final'?'최종 공동 미션':'운영 결과 점검'}</h2><div class="goal-grid">${r.checks.map(c=>`<div class="${c.pass?'pass':'miss'}"><span>${c.pass?'✓':'↗'} ${c.label}</span><strong>${c.value} <small>/ ${c.upper?'최대':'최소'} ${c.target}</small></strong></div>`).join('')}</div><p>성공 여부는 학생 평가에 사용하지 않습니다. 어떤 선택과 조건이 결과를 만들었는지 설명해 주세요.</p></section>`:''}${s.phase==='final'?comparison(r):`<div class="actions">${btn('next',s.phase==='build'?'운영 이후 보기 →':'최종 회의로 →','primary')}</div>`}`;}
function comparison(r){const old=E.result({...s,selected:s.proposal});return `<section class="comparison"><h2>처음 합의에서 무엇이 달라졌나요?</h2><p>같은 사건과 계산 규칙으로 최초 계획과 최종 계획을 비교합니다. 최초 계획은 실제 집행하지 않은 비교용 계산입니다.</p><div class="table-scroll"><table><thead><tr><th>부서</th><th>최초 합의</th><th>최종 실행</th></tr></thead><tbody>${E.D.map(d=>`<tr><th>${C.departments[d].short}</th><td>${E.cards[s.proposal[d]].name}</td><td>${E.cards[s.selected[d]].name}${s.proposal[d]!==s.selected[d]?' ↻':''}</td></tr>`).join('')}</tbody></table></div><p>${E.D.map((d,i)=>`${C.departments[d].short} ${old.final[i]} → ${r.final[i]}`).join(' · ')}<br>예비비 ${old.reserve} → ${r.reserve}칩</p><label>유지하거나 바꾼 선택 / 그 이유 / 아직 남은 공백<textarea data-reflection maxlength="1500">${esc(s.reflection)}</textarea></label><div class="actions">${btn('export','수업 기록 내보내기','primary')}${btn('materials','정리 활동지 보기','secondary')}</div></section>`;}
function render(){document.body.classList.toggle('large-type',large);document.body.classList.toggle('paper-mode',paper);if(paper){app.innerHTML=materials();return;}const r=E.result(s);app.innerHTML=`${toolbar()}<main id="main">${!started?briefing():`<div class="session-heading"><div><span class="eyebrow">한 턴 완결형 / ${s.minutes}분 수업</span><h1>${labels[E.phases.indexOf(s.phase)]}</h1></div><div>${btn('undo','↶ 실수한 입력 취소','secondary',history.length?'':'disabled')}${btn('timer','수동 타이머','quiet')}</div></div><nav class="phase-route" aria-label="진행 단계">${E.phases.map((p,i)=>`<span ${p===s.phase?'aria-current="step" class="current"':''}>${i+1}. ${labels[i]}</span>`).join('')}</nav>${mission()}${['plan','response'].includes(s.phase)?metrics(E.R.initial):''}${board(r)}${['plan','response'].includes(s.phase)?planning(r):results(r)}`}</main><footer><span id="save-status" role="status">${esc(notice)}</span><span>다온시 리부트 v0.4 · 모든 효과는 수업용 가정입니다.</span></footer>`;}
function download(){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify({state:s,history},null,2)],{type:'application/json'}));a.href=url;a.download='다온시-한턴-수업기록.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
let timer={remaining:300,running:false,until:0};
function timerText(){return Math.floor(timer.remaining/60).toString().padStart(2,'0')+':'+(timer.remaining%60).toString().padStart(2,'0');}
function timerModal(){modal('회의 타이머',`<p id="timer-display" class="timer-display" role="timer">${timerText()}</p><p>시간이 끝나도 정책을 확정하거나 화면을 넘기지 않습니다.</p>${btn('timer-toggle',timer.running?'일시 정지':'시작','primary')}${btn('timer-add','1분 추가')}${btn('timer-reset','5분으로 초기화')}`);}
setInterval(()=>{if(timer.running){timer.remaining=Math.max(0,Math.ceil((timer.until-Date.now())/1000));if(!timer.remaining)timer.running=false;const el=document.getElementById('timer-display');if(el)el.textContent=timerText();}},250);
async function act(a,el){
 if(a==='close'){dialog.close();return;}if(a==='begin'){started=true;change(E.advance(s));return;}if(a==='resume'){s=E.clone(saved.state);history=E.clone(saved.history);started=s.phase!=='brief';render();return;}
 if(a==='large'){large=!large;render();return;}if(a==='department'){department=el.dataset.id;render();document.getElementById('tab-'+department)?.focus();return;}
 if(a==='choose'){const scroll=window.scrollY;change(E.choose(s,el.dataset.id));window.scrollTo(0,scroll);return;}
 if(a==='next'){if(s.phase==='response'){modal('이 계획으로 집행할까요?',`<p>다섯 사업을 확정하면 건설과 서비스 개시를 공개합니다. 교사의 실수는 입력 취소로 복구할 수 있습니다.</p><p>집행 ${E.result(s).cost}칩 · 운영 후 예비비 ${E.result(s).reserve}칩</p>${btn('commit','최종 확정 · 건설 시작','primary')}`);return;}animate=false;change(E.advance(s));window.scrollTo(0,0);return;}
 if(a==='commit'){if(s.phase!=='response')return;dialog.close();animate=true;change(E.advance(s));window.scrollTo(0,0);return;}
 if(a==='skip'){animate=false;document.querySelector('.town-map')?.classList.remove('building');return;}
 if(a==='undo'){if(!history.length)return;modal('마지막 입력을 되돌릴까요?',`<p>정책 선택 또는 진행 단계 하나를 되돌립니다. 화면의 효과는 기록에서 다시 계산됩니다.</p>${btn('undo-apply','되돌리기','primary')}`);return;}
 if(a==='undo-apply'){if(history.length){s=history.pop();started=s.phase!=='brief';animate=false;save();dialog.close();render();}return;}
 if(a==='export'){download();return;}if(a==='import'){document.getElementById('import-file').click();return;}
 if(a==='tools'){modal('수업 저장·진행 도구',`<div class="tool-grid">${btn('export','수업 기록 파일 내보내기')}${btn('import','수업 기록 파일 가져오기')}${btn('timer','회의 타이머')}${btn('fullscreen','전체 화면')}${btn('new','새 수업 시작')}</div><label>수업 시간 (30–90분)<input id="lesson-minutes" type="number" min="30" max="90" value="${s.minutes}"></label>${btn('settings','시간 설정 저장')}<p>기본 모둠은 5개입니다. 실제 모둠 수에 맞춰 부서를 합치거나 역할을 나누되 다섯 부서의 의견을 모두 확인하세요.</p><p class="caption">이전 v0.3의 3턴 기록은 이전 실행본에서 열어 주세요. 자동 저장과 타이머는 같은 기기에서도 브라우저 설정에 영향을 받습니다.</p>`);return;}
 if(a==='settings'){const v=Number(document.getElementById('lesson-minutes').value);if(!Number.isInteger(v)||v<30||v>90)throw Error('30~90 사이의 정수 분을 입력해 주세요.');const n=E.clone(s);n.minutes=v;change(n);dialog.close();return;}
 if(a==='new'){modal('새 수업으로 초기화할까요?',`<p>현재 수업과 취소 기록을 지웁니다. 필요한 기록을 먼저 내보내세요.</p>${btn('export','기록 내보내기')}${btn('reset','초기화','primary')}`);return;}
 if(a==='reset'){s=E.initial();history=[];saved=null;started=false;animate=false;timer={remaining:300,running:false,until:0};save();dialog.close();render();return;}
 if(a==='fullscreen'){if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();return;}
 if(a==='materials'){paper=true;dialog.close();render();window.scrollTo(0,0);return;}if(a==='back'){paper=false;render();return;}if(a==='print'){window.print();return;}
 if(a==='timer'){if(dialog.open)dialog.close();timerModal();return;}if(a==='timer-toggle'){timer.running=!timer.running;timer.until=Date.now()+timer.remaining*1000;dialog.close();timerModal();return;}if(a==='timer-add'){timer.remaining+=60;if(timer.running)timer.until+=60000;dialog.close();timerModal();return;}if(a==='timer-reset'){timer={remaining:300,running:false,until:0};dialog.close();timerModal();return;}
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el)Promise.resolve(act(el.dataset.action,el)).catch(err=>{if(dialog.open)dialog.close();modal('확인해 주세요',`<p>${esc(err.message)}</p>`);});});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.note){s.notes[department][el.dataset.note]=el.type==='checkbox'?el.checked:el.value;save();const p=document.querySelector('.participation');if(p)p.textContent=`교차 검토 기록 ${E.D.filter(d=>s.notes[d].checked).length} / 5부서`;}if(el.hasAttribute('data-reflection')){s.reflection=el.value;save();}const status=document.getElementById('save-status');if(status)status.textContent=notice;});
document.addEventListener('keydown',e=>{if(e.target.getAttribute('role')!=='tab')return;let i=E.D.indexOf(department);if(e.key==='ArrowRight')i=(i+1)%5;else if(e.key==='ArrowLeft')i=(i+4)%5;else if(e.key==='Home')i=0;else if(e.key==='End')i=4;else return;e.preventDefault();department=E.D[i];render();document.getElementById('tab-'+department).focus();});
document.getElementById('import-file').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>1000000)throw Error('1MB 이하의 수업 기록 파일을 선택해 주세요.');const p=E.parse(await f.text());if(dialog.open)dialog.close();modal('기록을 불러올까요?',`<p>현재 수업을 가져온 기록으로 바꿉니다. 필요한 현재 기록은 먼저 내보내세요.</p>${btn('export','현재 기록 내보내기')}${btn('load','불러오기','primary')}`);dialog.querySelector('[data-action="load"]').onclick=()=>{s=p.state;history=p.history;saved=p;started=s.phase!=='brief';animate=false;timer={remaining:300,running:false,until:0};save();dialog.close();render();};}catch(err){if(dialog.open)dialog.close();modal('가져오지 못했습니다',`<p>${esc(err.message)}</p>`);}});
function materials(){return window.SessionMaterials(E,C,btn);}
render();
})();
</script></body></html>
