const page=(title,body,n)=>`<section class="paper-page sim-page"><p class="paper-meta">다온시 리부트 v0.5 · 2년 × 3기간 도시 운영 · 수업용 가정</p><h1>${title}</h1>${body}<footer>${n} / 10 · 모둠/이름 ____________________</footer></section>`;
let out=page('50분 공개수업 지도안',`<h2>학생이 설명할 수 있어야 할 것</h2><ol><li>인구 구조와 이동의 변화가 주거·일자리·돌봄·건강·교통 수요에 연결되는 경로를 설명한다.</li><li>시설의 수용력과 실제 공급을 구분하고 준비 기간·인력·운영비의 영향을 설명한다.</li><li>같은 조건 재도전에서 정책 조합과 시점을 바꾼 이유, 개선과 남은 공백을 근거로 설명한다.</li></ol><table><thead><tr><th>시간</th><th>활동</th><th>관찰할 행동</th></tr></thead><tbody><tr><td>0–6분</td><td>문제·규칙 설명</td><td>공급/수요, 가동 여력, 공동 목표 이해</td></tr><tr><td>6–10분</td><td>부서별 카드 검토</td><td>3개 정책의 비용·시차·기여 비교</td></tr><tr><td>10–25분</td><td>1차 운영 3기간</td><td>기간당 약 4분 회의+1분 결과 확인</td></tr><tr><td>25–29분</td><td>미달 원인·수정 가설</td><td>정책 시점·운영 부담·수요 공백 확인</td></tr><tr><td>29–41분</td><td>같은 조건 2차 운영</td><td>기간당 4분, 바꿀 선택에 집중</td></tr><tr><td>41–50분</td><td>운영 경로 비교·퇴장표</td><td>선택→조건→결과를 설명</td></tr></tbody></table><p>5개 부서가 반 전체 도시 하나를 운영한다. 교사는 시장·진행자로 선택을 입력한다. 학생 기기나 계정은 필요 없다. 모둠 수가 다르면 부서 역할을 합치거나 나눈다.</p><p>공식 성취기준 문구를 인용하지 않았다. 실제 학교의 교과서와 교육과정에 맞게 최종 연결을 확인한다. 시간 부족 시 두 번째 도전은 바꿀 1–2개 정책에 집중해 교사가 빠르게 입력한다.</p>`,1);
out+=page('교사 진행·운영 규칙',`<h2>도시는 교사가 넘길 때만 변합니다</h2><p>1기간은 2년, 한 도전은 3기간(6년)이다. 매 기간 새 정책 0–2개, 같은 부서에서는 최대 1개를 시작한다. 이미 시행한 정책은 재구매하지 않는다. 선택하지 않은 부서도 검토 의견을 하나씩 제시한다.</p><p>“다음 기간 진행”을 누르면 투자·준비 완료·세입·운영비·공급·수요·순이동을 한 번 계산한다. 보고서를 보고 다음 회의로 이동한다. 타이머가 끝나도 자동 진행하지 않는다.</p><h2>준비·가동·지속</h2><p>준비 0 정책은 해당 2년 안에 개시한다. 준비 1 정책은 다음 기간부터 개시하며 그때부터 운영비를 낸다. 매 기간의 수용력이 유지되는 것이지 건물이 매번 추가되는 것은 아니다. 3기간에 착수한 준비 1 정책은 6년 이후 개시하므로 이번 최종 결과에는 포함하지 않는다.</p><h2>공동 목표</h2><p>정착·돌봄건강·생활연결 각 85 이상, 예비비 4칩 이상, 가동 여력 80% 이상, 준비 중 사업을 포함한 향후 운영비가 다음 기간 세입·이전재원 이내. 인구 증가나 승패로 학생을 평가하지 않는다.</p><h2>재도전과 안전한 진행</h2><p>같은 조건 재도전은 초기 상태·카드·사건 순서를 복제한다. 능력치나 예산 보상은 없다. 다른 사건 조건은 전략 향상의 직접 비교로 쓰지 않는다. 최대 10도전까지 기록한다.</p><p>실수는 “직전 기간 취소”로 선택·메모·도시 상태를 복원한다. JSON을 내보내면 모든 도전이 보존된다. 자동 저장이 제한돼도 플레이와 파일 내보내기를 할 수 있다. 이전 v0.4 기록은 이전 실행본에서 연다.</p><p>수업 전 학교 PC의 HTML 직접 열기·프로젝터 가독성을 확인한다. 클라우드 환경에서는 file://를 관리자 정책으로 검증하지 못했다. 큰 글씨·전체 화면·연출 건너뛰기를 사용할 수 있다.</p>`,2);
E.D.forEach((d,i)=>{out+=page(C.departments[d].name+' 정책회의 기록',`<p><b>우리 질문:</b> ${C.departments[d].question}</p>${E.R.cards.filter(c=>c.department===d).map(c=>`<article class="paper-card"><h3>${c.id} ${c.name}</h3><p>초기 ${c.cost}칩 · 개시 후 매 기간 ${c.upkeep}칩 · ${c.delay?'다음 기간 개시':'이번 기간 개시'}</p><p>수용력: ${ef(c.capacity)}${c.inclusion?' / 연결 조건 +'+c.inclusion:''}<br>필요 인력 +${c.staff_need}팀 / 확보 인력 +${c.staff_supply}팀</p><p>${c.tradeoff}</p></article>`).join('')}<table><thead><tr><th>기간</th><th>제안 정책</th><th>다른 부서와의 연계·우려·운영 검토</th></tr></thead><tbody>${[1,2,3].map(n=>`<tr><td>${n} (${n*2-2}–${n*2}년)</td><td>　　　　　</td><td>　　　　　　　　　　　　　　　</td></tr>`).join('')}</tbody></table><p>우리 사업이 선택되지 않아도 의견을 제시하세요. 지금의 수요뿐 아니라 준비 기간·다음 운영비·인력을 검토합니다.</p><p>재도전에서 바꿀 선택과 시점 / 그 이유</p><div class="writing-space"></div>`,i+3);});
out+=page('두 도전의 도시 경로 비교',`<table><thead><tr><th>기간</th><th>이전 선택 → 이번 선택</th><th>어떤 원인을 바꾸었나요?</th></tr></thead><tbody>${[1,2,3].map(n=>`<tr><td>${n}</td><td>　　　　　　　　　　　　　</td><td>　　　　　　　　　　</td></tr>`).join('')}</tbody></table><p>이전 미달 조건 ____________________ → 이번 변화 ____________________</p><h2>개인 퇴장표</h2><p>1. 시설 수용력은 늘었는데 실제 공급이 부족할 수 있는 이유를 설명하세요.</p><div class="writing-space"></div><p>2. 인구 유입이 재정과 서비스 수요에 미치는 서로 다른 영향을 설명하세요.</p><div class="writing-space"></div><p>3. 같은 사건에서 어떤 정책의 조합·시점을 바꾸어 무엇이 개선됐나요? 현실에서 더 확인할 자료는 무엇인가요?</p><div class="writing-space"></div><p>관찰 기준: 인과 설명 / 정책 근거 / 교차 검토 / 수정 판단. 시민 소식은 상태에 연결한 가상 사례이며 시민 전체의 여론이 아니다.</p>`,8);
out+=page('정책·연계 효과 설계표',`<p class="compact">수용력 벡터 순서: 주거 / 일자리 / 돌봄 / 건강 / 교통. 단위는 비교용 서비스 지수이며 실제 인원·병상 수가 아니다.</p><table><thead><tr><th>정책</th><th>초기/운영</th><th>준비</th><th>수용력</th><th>인력 필요/확보</th><th>연결</th></tr></thead><tbody>${E.R.cards.map(c=>`<tr><td>${c.id} ${c.name}</td><td>${c.cost}/${c.upkeep}</td><td>${c.delay}</td><td>${c.capacity.join(',')}</td><td>${c.staff_need}/${c.staff_supply}</td><td>+${c.inclusion}</td></tr>`).join('')}</tbody></table><h2>두 정책이 모두 운영 중일 때</h2><ul>${E.R.synergies.map(l=>`<li>${l.pair.join('+')}: ${ef(l.capacity)} — ${l.label}</li>`).join('')}</ul><p class="compact">효과는 중첩 구매로 반복 지급하지 않는다. 두 정책이 운영 중인 매 기간의 수용력에 한 번 포함한다.</p>`,9);
out+=page('도시 계산·사건·목표 설계표',`<p class="compact">모든 연결·계수는 수업용 가정이다. 현실의 인과 관계를 무조건적인 사실로 해석하지 않는다.</p><table><tbody><tr><th>초기</th><td>인구 10,000명 · 예비비 8칩 · 수용력 52/48/40/44/45 · 인력 12팀, 기본 필요 8팀 · 연결 조건 70</td></tr><tr><th>기간 수입</th><td>12 + 제한(-2~2, 내림((기준 대비 인구 변화)/100))칩. 이전 기간 말 인구를 사용.</td></tr><tr><th>운영</th><td>기본 3칩 + 운영 중 정책의 유지비. 예산 부족은 미제공 서비스로 처리하고 숨은 부채 없음.</td></tr><tr><th>가동</th><td>예산 확보율 = 지급/필요 운영비. 인력 충족률 = 최소(1, 확보/필요). 서비스 가동 = 두 비율 중 낮은 값. 주거·일자리는 예산 비율만 적용.</td></tr><tr><th>수요</th><td>기준 60/56/48/52/52 + 기간 수×[0,0,2,3,1] + 기준 대비 인구 100명당 [0.6,0.5,0.3,0.4,0.4] + 사건.</td></tr><tr><th>순이동</th><td>이동 전 주거·일자리 충족 중 낮은 비율: 108% 이상 +200명, 100% 이상 +100명, 85% 미만 −100명, 나머지 0명. 이후 수요 재계산. 출생·사망은 계산하지 않음.</td></tr><tr><th>생활 지표</th><td>충족률은 공급/수요, 최대100%. 정착=min(주거,일자리). 돌봄건강=min(돌봄,건강). 생활연결=교통 충족률과 연결 조건의 평균.</td></tr></tbody></table><h2>공개된 사건</h2><p class="compact">기본: 점검→돌봄 집중→폭염. 변형: 첫 기간 점검, 나머지 3사건 중 2개를 시드로 선택. 같은 조건 재도전은 그대로 복제한다.</p><table><tbody>${E.R.events.map(e=>`<tr><th>${e.name}</th><td>${ef(e.demand).replaceAll('수용력','수요')}</td></tr>`).join('')}</tbody></table><p class="compact">사건 추가 수요는 해당 기간만 적용. 목표: 세 생활 지표 ≥85, 예비비 ≥4, 가동 ≥80%, 준비 사업까지 포함한 향후 운영비 ≤다음 수입. 인구 증가는 목표가 아니다. 정책 수용력은 매 기간 유지되며 과거의 수치를 다시 더하지 않는다.</p>`,10);
return `<div class="paper-toolbar">${btn('back','게임으로 돌아가기')}${btn('print','인쇄 / PDF 저장','primary')}</div>${out}`;
};

(()=>{'use strict';
const E=CitySim,C=DaonContent,V=SimVisuals,app=document.getElementById('app'),dialog=document.getElementById('dialog'),KEY='daon-sim-v1';
let game=E.session(),saved=null,started=false,paper=false,department='Y',notice='',animate=false;
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),btn=(a,t,cls='',extra='')=>`<button type="button" data-action="${a}" class="${cls}" ${extra}>${t}</button>`,pct=x=>E.round(x*100)+'%',names=ids=>ids.map(id=>E.cards[id].name).join(', '),signed=n=>(n>0?'+':'')+n;
try{const raw=localStorage.getItem(KEY);if(raw)saved=E.parse(raw);}catch(e){notice='자동 저장을 읽지 못했습니다. JSON 기록을 가져오거나 새 수업으로 시작하세요.';}
function save(){try{localStorage.setItem(KEY,JSON.stringify(game));notice='이 브라우저에 자동 저장됨';}catch{notice='자동 저장이 제한되었습니다. 수업 기록을 파일로 내보내 주세요.';}}
function modal(t,b){if(dialog.open)dialog.close();dialog.innerHTML=`<h2 id="dialog-title">${t}</h2>${b}<div class="modal-actions">${btn('close','닫기')}</div>`;dialog.showModal();}
function change(n,top=false){game=n;save();render();if(top)window.scrollTo(0,0);}
function bar(){return `<header class="topbar"><a class="brand" href="#main"><span class="brand-emblem">D</span><span>다온시 <b>리부트</b><small>6년의 변화, 함께 운영하는 도시</small></span></a><nav>${btn('materials','수업 자료','quiet')}${btn('tools','저장·진행 도구','quiet')}${btn('large','큰 글씨','quiet',`aria-pressed="${game.settings.large}"`)}</nav></header>`;}
function metrics(city){const titles=['정착 여건','돌봄·건강 접근','생활 연결'];return `<div class="sim-metrics">${titles.map((t,i)=>`<article><span>${t}</span><strong data-quality="${i}">${city.quality[i]}<small>/100</small></strong><p>${['주거·일자리 중 낮은 충족률','돌봄·건강 중 낮은 충족률','교통 충족률·정보 접근 조건'][i]}</p></article>`).join('')}<article><span>도시 예비비</span><strong data-cash>${city.cash}<small>칩</small></strong><p>반복 운영 ${city.upkeep}칩 / 기간</p></article></div>`;}
function home(){return `<section class="brief-grid"><div><span class="eyebrow">CITY OPERATIONS / 3 PERIODS × 2 YEARS</span><h1>짓는 것에서,<br><em>살아갈 수 있는 도시로.</em></h1><p class="lead">시설은 남고, 운영은 계속됩니다.<br>다섯 부서가 6년의 변화를 함께 결정하세요.</p><div class="brief-chips"><b>2년씩 3기간</b><b>기간당 새 정책 0–2개</b><b>같은 조건 재도전</b></div><p>교사가 기간을 넘길 때만 도시가 변합니다. 준비 중인 사업, 늘어나는 서비스 수요, 반복 운영비를 함께 살펴보세요.</p><div class="actions">${btn('start','도시 운영 시작 →','primary')}${saved?btn('resume','저장한 수업 이어가기','secondary'):''}</div><p class="caption">50분 · 교사 PC 1대 · 학생 계정 없이 · 오프라인</p></div><div class="home-map">${V.map(E.initial())}<p>지도 숫자 = 실제 공급 / 필요한 서비스 단위</p></div></section><section class="intro-grid"><article><h2>공동 목표</h2><p>세 생활 지표 각각 85 이상, 예비비 4칩 이상, 서비스 가동 여력 80% 이상, 준비 중인 사업까지 포함한 향후 운영비가 다음 세입·이전재원 이내인 도시를 만듭니다. 인구 증가는 승리 조건이 아닙니다.</p></article><article><h2>공개된 수업 모형</h2><p>기준 인구 1만 명. 기간마다 돌봄·건강·교통 수요를 점검합니다. 순이동은 주거·일자리 조건에 따라 제한적으로 계산하며 출생·사망이나 출산율은 예측하지 않습니다.</p></article></section><p class="disclaimer">모든 수치·인과 관계는 토론을 위한 수업용 가정입니다. 실제 사회에서는 지역 여건과 다양한 요인이 작용합니다. 정책의 유일한 정답이나 학생 평가 점수가 아닙니다.</p>`;}
function eventPanel(a,city){const id=E.schedule(a.seed)[city.period],ev=E.events[id];return `<section class="event-alert"><span class="eyebrow">이번 기간의 공개된 조건</span><h2>${ev.name}</h2><p>${ev.text}</p><p>${ev.demand.some(Boolean)?ev.demand.map((v,i)=>v?`${E.R.services[i]} 수요 +${v}`:'').filter(Boolean).join(' · '):'추가 사건 수요 없음'}</p><p class="caption">사건의 영향은 해당 기간에만 적용됩니다. 피해·계산 조건을 선택 전에 공개합니다.</p></section>`;}
function cityBoard(a,city,report){const planning=a.phase==='plan',weak=city.coverage.map((v,i)=>({v,i})).sort((a,b)=>a.v-b.v)[0];return `<section class="city-stage"><div class="board-title"><div><span class="eyebrow">DAON CITY / YEAR ${city.period*2}</span><h2>${planning?'다음 2년을 준비하는 도시':'정책이 남고, 일상이 이어집니다'}</h2></div><span class="tag">관찰 인구 ${city.population.toLocaleString()}명</span></div><div class="operations-board">${V.map(city,planning?a.draft:[],report?.opened||[],animate)}<aside class="operations-sidebar"><h3>지금 가장 큰 공백</h3><p class="issue">${E.R.services[weak.i]}<strong>${pct(weak.v)} 충족</strong></p><p>실제 공급 ${city.effective[weak.i]}<br>필요 수요 ${city.demand[weak.i]}</p><div class="operating-health"><b>운영 인력 ${city.staff} / ${city.staffNeed}팀</b><b>서비스 가동 여력 ${pct(city.utilization)}</b></div><p class="caption">기본 수요의 변화·사업 준비·운영 여력이 실제 공급에 반영됩니다.</p></aside></div><div class="board-bottom"><span>회색: 기존 시설 · 정책 표식: 계획/준비/운영/가동 제한</span>${animate?btn('skip','변화 연출 건너뛰기','light'):''}</div><p class="caption">시설 표식은 서비스를 표현합니다. 고정된 생활권에 자동 배치하며 건물 수로 인구를 예측하지 않습니다.</p></section>`;}
function supplyTable(city){return `<details class="ledger"><summary>생활권별 공급·수요와 가동 근거</summary><div class="table-scroll"><table><thead><tr><th>생활권</th><th>정상 가동 수용력</th><th>실제 공급</th><th>수요</th><th>충족률</th></tr></thead><tbody>${E.R.services.map((t,i)=>`<tr><th>${t}</th><td>${city.capacity[i]}</td><td>${city.effective[i]}</td><td>${city.demand[i]}</td><td>${pct(city.coverage[i])}</td></tr>`).join('')}</tbody></table></div><p>주거·일자리는 운영 예산 확보율, 돌봄·건강·교통은 예산 확보율과 인력 충족률 중 낮은 비율을 적용합니다. 단위는 비교용 서비스 지수이며 건물 수·병상 수·인구수와 같지 않습니다.</p><p>생활 연결은 교통 충족률과 정보·참여 접근 조건(${city.inclusion})을 평균한 지표입니다.</p></details>`;}
function policy(id,a,city){const c=E.cards[id],selected=a.draft.includes(id),existing=city.projects.find(p=>p.id===id),candidate=selected?a.draft.filter(x=>x!==id):[...a.draft.filter(x=>E.cards[x].department!==c.department),id],err=E.selectionError(city,candidate),late=c.delay&&city.period===E.R.periods-1;return `<article class="policy ${selected?'chosen':''}" data-card="${id}" style="--dept:${C.departments[c.department].color}"><div class="card-top"><span>${id} · ${c.delay?'다음 기간 개시':'이번 기간 개시'}</span><b>${c.cost}칩</b></div><h3>${c.name}</h3><p>${c.tradeoff}</p><div class="effect-list">${c.capacity.map((n,i)=>n?`<span class="effect">${E.R.services[i]} 수용력 +${n}</span>`:'').join('')}${c.inclusion?`<span class="effect">지역 연결 조건 +${c.inclusion}</span>`:''}${c.staff_supply?`<span class="effect">운영 인력 +${c.staff_supply}팀</span>`:''}</div><p class="upkeep">개시 후 매 기간 ${c.upkeep}칩<br>필요 운영 인력 +${c.staff_need}팀</p><details><summary>시차·연계·지속 효과</summary><p>${c.delay?'준비에 2년이 걸립니다. 투자한 다음 기간부터 효과와 유지비가 적용됩니다.':'이번 2년 관찰 기간 안에 개시하여 효과와 유지비가 적용됩니다.'} 이후 도전 종료까지 서비스가 유지됩니다.</p>${E.R.synergies.filter(l=>l.pair.includes(id)).map(l=>`<p>✦ ${l.label}: ${l.capacity.map((v,i)=>v?E.R.services[i]+' +'+v:'').filter(Boolean).join(', ')}. 두 정책이 모두 운영 중일 때 공급에 포함합니다.</p>`).join('')}</details>${late?'<p class="late-warning">이번에 시작하면 6년 이후 개시합니다. 이번 최종 지표에는 포함되지 않습니다.</p>':''}${btn('choose',existing?(existing.ready>city.period?'준비 중 · 재구매 불가':'운영 중 · 지속 적용'):selected?'✓ 제안됨 · 선택 취소':'이번 기간에 제안',selected?'primary':'secondary',`data-id="${id}" aria-pressed="${selected}" ${existing||(!selected&&err)?'disabled':''}`)}${!existing&&!selected&&err?`<p class="caption">${esc(err)}</p>`:''}</article>`;}
function budget(city,forecast){const b=forecast.budget;return `<aside class="budget"><span class="eyebrow">NEXT PERIOD BUDGET</span><h2>가용 예산 <strong>${b.available}칩</strong></h2><p class="caption">이월 ${b.carry} + 세입·이전재원 ${b.income}</p><div class="money"><span>새 투자</span><b>${b.capital}칩</b></div><div class="money"><span>이번 운영 필요</span><b>${b.requested}칩</b></div><div class="money ${b.unfunded?'over':''}"><span>운영 부족</span><b>${b.unfunded}칩</b></div><div class="money"><span>기간 말 예상 잔액</span><b>${b.reserve}칩</b></div><p>예상 인력 ${forecast.after.staff}/${forecast.after.staffNeed}팀<br>서비스 가동 ${pct(forecast.after.utilization)}</p><p class="caption">운영비 부족은 미제공 서비스로 반영합니다. 숨은 부채를 만들지 않습니다. 필요하면 새 정책 없이 기존 사업을 운영할 수 있습니다.</p></aside>`;}
function notes(a){const n=a.notes.reviews[department];return `<details class="notes"><summary>${C.departments[department].name} · 검토 의견 기록</summary><p>${C.departments[department].review.replace('다음 운영비','반복 운영비')}</p><label>우리 부서의 제안·다른 부서와의 연계<textarea data-review maxlength="1500">${esc(n.text)}</textarea></label><label><input type="checkbox" data-checked ${n.checked?'checked':''}> 이번 기간에 제안 또는 교차 검토 의견을 전달함</label><label>반 전체의 선택 근거<textarea data-reason maxlength="1500">${esc(a.notes.reason)}</textarea></label><p class="caption">종이에 적고 체크만 해도 됩니다. 선택되지 않은 부서도 운영 부담과 수요 공백을 검토하세요.</p></details>`;}
function planning(a,city){const f=E.forecast(city,a.draft,E.schedule(a.seed)[city.period]);return `${eventPanel(a,city)}<section class="planning-grid"><div><div class="section-title"><h2>이번 기간의 정책회의</h2><span>새 정책 0–2개 · 부서당 1개</span></div><div class="tabs" role="tablist" aria-label="정책 부서">${E.D.map(d=>`<button type="button" role="tab" id="tab-${d}" aria-controls="policies" aria-selected="${d===department}" tabindex="${d===department?0:-1}" data-action="department" data-id="${d}" class="${d===department?'active':''}">${C.departments[d].short}${a.draft.some(id=>id[0]===d)?' ●':''}</button>`).join('')}</div><div id="policies" role="tabpanel" aria-labelledby="tab-${department}"><p class="department-question">${C.departments[department].question}</p><div class="cards">${E.R.cards.filter(c=>c.department===department).map(c=>policy(c.id,a,city)).join('')}</div></div>${notes(a)}<p class="participation">검토 의견 전달 ${E.D.filter(d=>a.notes.reviews[d].checked).length} / 5부서</p></div>${budget(city,f)}</section><details class="ledger"><summary>교사용 예상 결과 · 계산은 선택 전에 공개됩니다</summary><p>다음 기간 예상 생활 지표 ${f.after.quality.join(' / ')}. 새 정책뿐 아니라 기존 사업·사건·수요·가동 여력이 함께 반영됩니다.</p><ul>${f.reasons.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></details><div class="decision"><div><strong>${a.draft.length} / 2개 새 정책</strong><span>${a.draft.length?names(a.draft):'새 투자 없이 기존 서비스를 운영합니다.'}</span></div>${btn('confirm-open',`다음 기간 진행 · ${city.period*2}–${(city.period+1)*2}년 →`,'primary')}</div>`;}
function projects(city){return `<details class="ledger"><summary>누적 사업 ${city.projects.length}개 · 준비와 반복 운영 현황</summary><div class="table-scroll"><table><thead><tr><th>정책</th><th>시작 기간</th><th>개시 기간</th><th>상태</th><th>운영비/기간</th></tr></thead><tbody>${city.projects.map(p=>`<tr><th>${p.id} ${E.cards[p.id].name}</th><td>${p.started}</td><td>${p.ready}${p.ready>E.R.periods?' · 관찰 이후':''}</td><td>${p.ready>city.period?'준비 중':'운영 중'}</td><td>${E.cards[p.id].upkeep}</td></tr>`).join('')}</tbody></table></div><p>공개수업에서는 사업 철회·시설 철거를 조작하지 않습니다. 기존 정책의 비용을 감안해 후속 투자를 조절합니다.</p></details>`;}
function report(a,r){const city=r.after,g=E.goal(city);return `<section class="result-intro"><span class="eyebrow">${city.period*2-2}–${city.period*2}년 도시 운영 보고서</span><h2>${a.phase==='complete'?(g.success?'살아갈 여건과 운영 기반을 함께 확보했습니다':'다음 전략에서 보완할 조건이 보입니다'):'이번 2년에 무엇이 달라졌나요?'}</h2><div class="change-strip">${['정착','돌봄·건강','생활 연결'].map((t,i)=>`<span>${t} ${signed(E.round(city.quality[i]-r.before.quality[i]))}</span>`).join('')}<span>순이동 ${signed(r.migration)}명</span></div><ul class="causal-list">${r.reasons.slice(0,3).map(t=>`<li>${esc(t)}</li>`).join('')}</ul>${r.funding<1||r.staffRatio<1?`<p class=late-warning>가동 제한: 운영 예산 확보 ${pct(r.funding)} · 인력 충족 ${pct(r.staffRatio)}. 아래 계산 근거에서 영향을 확인하세요.</p>`:''}</section><section class="news-grid">${r.news.map(n=>`<article><span class="eyebrow">도시 생활 소식</span><p>${esc(n.text)}</p><small>근거: ${esc(n.basis)}</small></article>`).join('')}</section><p class="caption">상태에 연결한 가상의 생활 사례입니다. 한 사람의 반응이 도시 전체의 평가를 대표하지 않습니다.</p><section class="future-report"><h3>앞으로 나타날 효과와 남은 문제</h3><p>준비 중인 사업까지 개시하면 확정 운영 부담은 ${E.committedUpkeep(city)}칩 / 기간입니다.</p><p>${r.pending.length?r.pending.map(p=>`${E.cards[p.id].name}: ${p.ready}기간 개시${p.ready>3?'(6년 이후·이번 판정 제외)':''}`).join(' / '):'현재 준비 중인 사업은 없습니다. 기존 서비스의 운영비는 다음 기간에도 필요합니다.'}</p><p>${city.coverage.map((v,i)=>v<.85?`${E.R.services[i]} 공급 부족 ${E.round(city.demand[i]-city.effective[i])}단위`:'').filter(Boolean).join(' · ')||'현재 생활권별 충족률은 모두 85% 이상입니다. 향후 수요와 운영 여력을 함께 점검하세요.'}</p></section>${calculation(r)}${a.phase==='complete'?`<section class="goals"><h2>최종 공동 목표</h2><div class="goal-grid">${g.checks.map(c=>`<div class="${c.pass?'pass':'miss'}"><span>${c.pass?'✓':'↗'} ${c.label}</span><strong>${c.value} <small>/ ${c.upper?'최대':'최소'} ${c.target}</small></strong></div>`).join('')}</div><p>미달 원인: ${g.checks.filter(c=>!c.pass).map(c=>c.label).join(' · ')||'모든 목표 충족'}. 인구 증가 여부나 승패로 학생을 평가하지 않습니다.</p></section>${compare(a)}<label>재도전 가설 / 바꿀 정책과 시점 / 예상 이유<textarea data-reflection maxlength="1500">${esc(a.reflection)}</textarea></label><div class="actions">${btn('retry','같은 조건으로 재도전 →','primary')}${btn('retry-new','사건을 다시 뽑아 도전','secondary')}${btn('export','기록 내보내기','secondary')}</div>`:`<div class="actions">${btn('advance','다음 정책회의로 →','primary')}</div>`}`;}
function calculation(r){const b=r.budget;return `<details class="ledger"><summary>예산·수요·공급 계산 근거 펼치기</summary><ul>${r.reasons.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><p>예산: 이월 ${b.carry} + 수입 ${b.income} − 초기 투자 ${b.capital} − 지급 운영비 ${b.paid} = 잔액 ${b.reserve}칩.<br>요구 운영비 ${b.requested}칩 중 ${b.unfunded}칩 부족. 예산 확보율 ${pct(r.funding)} · 인력 충족률 ${pct(r.staffRatio)}.</p><div class="table-scroll"><table><thead><tr><th>공급 원인</th>${E.R.services.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody><tr><th>기존 도시 수용력</th>${E.R.initial.capacity.map(x=>`<td>${x}</td>`).join('')}</tr>${r.contributions.map(c=>`<tr><th>${esc(c.label)}</th>${c.vector.map(x=>`<td>${x||'—'}</td>`).join('')}</tr>`).join('')}${r.links.map(l=>`<tr><th>연계: ${l.label}</th>${l.capacity.map(x=>`<td>${x||'—'}</td>`).join('')}</tr>`).join('')}<tr><th>정상 가동 수용력</th>${r.after.capacity.map(x=>`<td>${x}</td>`).join('')}</tr><tr><th>예산·인력 반영 실제 공급</th>${r.after.effective.map(x=>`<td>${x}</td>`).join('')}</tr></tbody></table></div><p>수요 = 기준 수요 + 기간별 수요 변화 + 기준 인구 대비 순이동에 따른 수요 + 해당 기간 사건. 인구 이동 전 주거·일자리 충족률로 순이동을 정한 뒤, 이동 이후 수요를 다시 계산합니다. 상세 계수는 수업 자료의 설계표에서 확인합니다.</p></details>`;}
function compare(a){if(game.attempts.length<2)return '<section class="comparison"><h2>첫 도전의 운영 경로를 남깁니다</h2><p>시설을 선택한 시기, 운영 부담, 미충족 수요를 살펴보고 다음 도전에서 바꿀 전략을 적어 주세요.</p></section>';const prev=game.attempts.at(-2),before=E.replay(prev),after=E.replay(a),same=JSON.stringify(E.schedule(prev.seed))===JSON.stringify(E.schedule(a.seed));return `<section class="comparison"><span class="tag">${same?'같은 초기값·사건 순서':'사건 조건 다름 · 전략 효과를 단정하지 않기'}</span><h2>${game.attempts.length-1}차 → ${game.attempts.length}차 운영 경로</h2><div class="table-scroll"><table><thead><tr><th>기간</th><th>이전 선택</th><th>이번 선택</th><th>생활 지표 변화: 이전 → 이번</th></tr></thead><tbody>${a.turns.map((t,i)=>`<tr><th>${i+1} (${(i+1)*2}년)</th><td>${names(prev.turns[i].picks)||'운영 유지'}</td><td>${names(t.picks)||'운영 유지'}</td><td>${before.reports[i].after.quality.join('/')} → ${after.reports[i].after.quality.join('/')}</td></tr>`).join('')}</tbody></table></div><p>이전 미달: ${E.goal(before.city).checks.filter(c=>!c.pass).map(c=>c.label).join(', ')||'없음'}<br>예비비 ${before.city.cash} → ${after.city.cash}칩 · 가동 여력 ${pct(before.city.utilization)} → ${pct(after.city.utilization)}</p><p>무엇이 부족했고, 어떤 정책의 시점이나 조합을 바꿔 개선했나요?</p></section>`;}
function render(){document.body.classList.toggle('large-type',game.settings.large);document.body.classList.toggle('paper-mode',paper);if(paper){app.innerHTML=SimMaterials(E,C,btn);return;}const a=E.current(game),{city,reports}=E.replay(a),r=reports.at(-1);app.innerHTML=`${bar()}<main id="main">${!started?home():`<div class="session-heading"><div><span class="eyebrow">${game.attempts.length}차 도전 · ${game.settings.minutes}분 수업 · 1기간 = 2년</span><h1>${a.phase==='plan'?`${city.period+1}기간 정책회의`:a.phase==='complete'?'6년 도시 운영 결과':`${city.period}기간 보고서`}</h1></div><div>${btn('timer','회의 타이머','quiet')}${city.period?btn('undo','직전 기간 취소','secondary'):''}</div></div><div class="phase-route">${E.schedule(a.seed).map((id,i)=>`<span class="${i===(a.phase==='plan'?city.period:city.period-1)?'current':''}">${i+1}기간 · ${i*2}–${i*2+2}년 · ${E.events[id].name}</span>`).join('')}</div>${metrics(city)}${cityBoard(a,city,a.phase==='plan'?null:r)}${supplyTable(city)}${projects(city)}${a.phase==='plan'?planning(a,city):report(a,r)}`}</main><footer><span id="save-status" role="status">${esc(notice)}</span><span>다온시 리부트 v0.5 · 수업용 모형, 실제 인구 예측 아님</span></footer>`;}
function download(){const url=URL.createObjectURL(new Blob([JSON.stringify(game,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='다온시-도시운영-기록.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
let timer={remaining:240,running:false,until:0};const timeText=()=>Math.floor(timer.remaining/60).toString().padStart(2,'0')+':'+(timer.remaining%60).toString().padStart(2,'0');function timerModal(){modal('정책회의 타이머',`<p id="timer-display" class="timer-display" role="timer">${timeText()}</p><p>시간이 끝나도 도시의 기간은 진행되지 않습니다.</p>${btn('timer-toggle',timer.running?'일시 정지':'시작','primary')}${btn('timer-add','1분 추가')}${btn('timer-reset','4분으로 초기화')}`);}
setInterval(()=>{if(timer.running){timer.remaining=Math.max(0,Math.ceil((timer.until-Date.now())/1000));if(!timer.remaining)timer.running=false;const el=document.getElementById('timer-display');if(el)el.textContent=timeText();}},250);
async function act(action,el){const a=E.current(game),city=E.replay(a).city;
 if(action==='close'){dialog.close();return;}if(action==='start'){started=true;change(game,true);return;}if(action==='resume'){game=saved;started=true;render();return;}if(action==='large'){game.settings.large=!game.settings.large;if(started)save();render();return;}
 if(action==='department'){department=el.dataset.id;render();document.getElementById('tab-'+department).focus();return;}if(action==='choose'){const scroll=window.scrollY;change(E.choose(game,el.dataset.id));window.scrollTo(0,scroll);return;}
 if(action==='confirm-open'){const f=E.forecast(city,a.draft,E.schedule(a.seed)[city.period]);modal('다음 2년을 진행할까요?',`<p>${a.draft.length?names(a.draft):'새 정책 없이 기존 서비스를 운영합니다.'}</p><p>초기 투자 ${f.budget.capital}칩 · 반복 운영 ${f.budget.requested}칩 · 예상 운영 부족 ${f.budget.unfunded}칩</p><p>정책 준비·수요·순이동·운영비를 한 번 계산합니다.</p>${btn('commit','이 계획으로 기간 진행','primary')}`);return;}
 if(action==='commit'){if(a.phase!=='plan')return;dialog.close();timer.running=false;animate=true;change(E.commit(game),true);return;}
 if(action==='advance'){animate=false;timer={remaining:240,running:false,until:0};change(E.advance(game),true);return;}if(action==='skip'){animate=false;document.querySelector('.sim-town')?.classList.remove('animating');return;}
 if(action==='undo'){modal('직전 기간을 취소할까요?',`<p>정책·유지비·인구·수요·준비 상태를 그 기간 전으로 되돌리고 당시 선택과 토론 기록을 복원합니다. 현재 미확정 선택은 대체됩니다.</p>${btn('undo-apply','직전 기간 되돌리기','primary')}`);return;}if(action==='undo-apply'){animate=false;dialog.close();change(E.undo(game),true);return;}
 if(action==='retry'||action==='retry-new'){const seed=action==='retry-new'?(crypto.getRandomValues(new Uint32Array(1))[0]||1):undefined;animate=false;department='Y';timer={remaining:240,running:false,until:0};change(E.retry(game,seed),true);return;}
 if(action==='export'){download();return;}if(action==='import'){document.getElementById('import-file').click();return;}
 if(action==='tools'){modal('저장·진행 도구',`<div class="tool-grid">${btn('export','모든 도전 기록 내보내기')}${btn('import','기록 가져오기')}${btn('history','이전 도전 기록')}${btn('timer','회의 타이머')}${btn('fullscreen','전체 화면')}${btn('new','새 수업')}</div><label>수업 시간 30–90분 <input id="minutes" type="number" min="30" max="90" value="${game.settings.minutes}"></label>${btn('settings','시간 설정 저장')}<p>모둠 수가 달라도 다섯 부서의 역할을 합치거나 나눠 운영하세요. 이전 v0.4 기록은 v0.4 실행본에서 열 수 있습니다.</p>`);return;}
 if(action==='settings'){const n=Number(document.getElementById('minutes').value);if(!Number.isInteger(n)||n<30||n>90)throw Error('30–90분 사이 정수를 입력하세요.');game.settings.minutes=n;dialog.close();change(game);return;}
 if(action==='history'){modal('도전별 운영 기록',game.attempts.map((at,i)=>{const rep=E.replay(at);return `<details><summary>${i+1}차 · ${at.turns.length}기간 · ${at.phase==='complete'?(E.goal(rep.city).success?'목표 충족':'미달 조건 있음'):'진행 중'}</summary>${at.turns.map((t,j)=>`<p><b>${j+1}기간:</b> ${names(t.picks)||'운영 유지'}<br>생활 지표 ${rep.reports[j].after.quality.join('/')} · 잔액 ${rep.reports[j].after.cash}칩<br>근거: ${esc(t.notes.reason)}</p>${E.D.map(d=>t.notes.reviews[d].text?`<p>${C.departments[d].short}: ${esc(t.notes.reviews[d].text)}</p>`:'').join('')}`).join('')}<p>미달: ${E.goal(rep.city).checks.filter(c=>!c.pass).map(c=>c.label).join(', ')||'없음'}</p><p>전략 기록: ${esc(at.reflection)}</p></details>`;}).join(''));return;}
 if(action==='new'){modal('새 수업으로 초기화할까요?',`<p>현재 수업과 이전 도전을 모두 지웁니다. 필요한 기록을 먼저 내보내세요.</p>${btn('export','기록 내보내기')}${btn('reset','새 수업 시작','primary')}`);return;}if(action==='reset'){game=E.session();started=false;saved=null;animate=false;timer={remaining:240,running:false,until:0};dialog.close();save();render();return;}
 if(action==='materials'){paper=true;dialog.close();render();window.scrollTo(0,0);return;}if(action==='back'){paper=false;render();return;}if(action==='print'){window.print();return;}
 if(action==='fullscreen'){if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();return;}
 if(action==='timer'){timerModal();return;}if(action==='timer-toggle'){timer.running=!timer.running;timer.until=Date.now()+timer.remaining*1000;timerModal();return;}if(action==='timer-add'){timer.remaining+=60;if(timer.running)timer.until+=60000;timerModal();return;}if(action==='timer-reset'){timer={remaining:240,running:false,until:0};timerModal();return;}
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el)Promise.resolve(act(el.dataset.action,el)).catch(err=>modal('확인해 주세요',`<p>${esc(err.message)}</p>`));});
document.addEventListener('input',e=>{const el=e.target,a=E.current(game);if(el.hasAttribute('data-review'))a.notes.reviews[department].text=el.value;else if(el.hasAttribute('data-checked'))a.notes.reviews[department].checked=el.checked;else if(el.hasAttribute('data-reason'))a.notes.reason=el.value;else if(el.hasAttribute('data-reflection'))a.reflection=el.value;else return;save();const status=document.getElementById('save-status');if(status)status.textContent=notice;const count=document.querySelector('.participation');if(count)count.textContent=`검토 의견 전달 ${E.D.filter(d=>a.notes.reviews[d].checked).length} / 5부서`;});
document.addEventListener('keydown',e=>{if(e.target.getAttribute('role')!=='tab')return;let i=E.D.indexOf(department);if(e.key==='ArrowRight')i=(i+1)%5;else if(e.key==='ArrowLeft')i=(i+4)%5;else if(e.key==='Home')i=0;else if(e.key==='End')i=4;else return;e.preventDefault();department=E.D[i];render();document.getElementById('tab-'+department).focus();});
document.getElementById('import-file').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>2000000)throw Error('2MB 이하의 기록을 선택하세요.');const incoming=E.parse(await f.text());modal('도시 운영 기록을 불러올까요?',`<p>현재 기록을 가져온 수업으로 바꿉니다. 필요한 기록은 먼저 내보내세요.</p>${btn('export','현재 기록 내보내기')}${btn('load','불러오기','primary')}`);dialog.querySelector('[data-action="load"]').onclick=()=>{game=incoming;started=true;animate=false;timer={remaining:240,running:false,until:0};dialog.close();save();render();};}catch(err){modal('가져오지 못했습니다',`<p>${esc(err.message)}</p>`);}});
render();
})();
</script></body></html>
